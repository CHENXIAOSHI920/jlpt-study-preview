  const target = statusMapForSource(source);
  target[id] = result;
  saveStatuses();
  renderSidebar();
}

function createSortSession() {
  return {
    blocks: {
      "1": { id: "1", kind: "single", members: [1] },
      "2": { id: "2", kind: "single", members: [2] },
      "3": { id: "3", kind: "single", members: [3] },
      "4": { id: "4", kind: "single", members: [4] }
    },
    availableBlockIds: ["1", "2", "3", "4"],
    slots: [null, null, null, null],
    selectedBlockIds: [],
    hintsShown: 0,
    latestResult: null,
    displayResult: null,
    lastAttempt: null,
    message: ""
  };
}

function getSortSession(id) {
  if (!state.sortSessions[id]) state.sortSessions[id] = createSortSession();
  return state.sortSessions[id];
}

function getExamSession(id) {
  if (!state.examSessions[id]) {
    state.examSessions[id] = {
      choice: null,
      latestResult: state.examStatuses[id] || null,
      revealed: false
    };
  }
  return state.examSessions[id];
}

function blockById(session, id) {
  return session.blocks[id] || null;
}

function blockSize(block) {
  return block.members.length;
}

function blockLabel(block) {
  return block.kind === "composite"
    ? `${block.id}(${block.members.join("")})`
    : block.id;
}

function blockText(question, block) {
  return block.members
    .map((id) => optionById(question, id).text)
    .join(" + ");
}

function findBlockStart(session, blockId) {
  return session.slots.indexOf(blockId);
}

function isBlockPlaced(session, blockId) {
  return findBlockStart(session, blockId) !== -1;
}

function flattenSlotMembers(session) {
  const result = [];
  const seen = new Set();
  for (const id of session.slots) {
    if (!id || seen.has(id)) continue;
    seen.add(id);
    const block = blockById(session, id);
    if (block) result.push(...block.members);
  }
  return result;
}

function arrangementBySlot(session) {
  return session.slots.map((id, index) => {
    if (!id) return null;
    const block = blockById(session, id);
    const start = findBlockStart(session, id);
    return block.members[index - start] ?? null;
  });
}

function validateSortSession(session) {
  const allMembers = Object.values(session.blocks)
    .flatMap((block) => block.members)
    .sort((a, b) => a - b);
  const allIdsValid = JSON.stringify(allMembers) === JSON.stringify([1, 2, 3, 4]);
  const slotIds = [...new Set(session.slots.filter(Boolean))];
  const available = new Set(session.availableBlockIds);
  let valid = allIdsValid
    && available.size === session.availableBlockIds.length
    && slotIds.every((id) => blockById(session, id))
    && !slotIds.some((id) => available.has(id))
    && Object.keys(session.blocks).every((id) => isBlockPlaced(session, id) || available.has(id));

  for (const id of slotIds) {
    const block = blockById(session, id);
    const positions = session.slots
      .map((slotId, index) => slotId === id ? index : -1)
      .filter((index) => index >= 0);
    if (
      positions.length !== blockSize(block)
      || positions[0] + blockSize(block) - 1 !== positions[positions.length - 1]
    ) {
      valid = false;
    }
  }

  if (!valid) console.error(`排序块状态异常：第${currentQuestion().id}题`);
  return valid;
}

const DAY_MS = 86400000;
const JLPT_EXAM_SCHEDULE = [
  "2026-12-06",
  "2027-07-04",
  "2027-12-05"
];

function utcDayFromISO(dateString) {
  const [year, month, day] = dateString.split("-").map(Number);
  return Date.UTC(year, month - 1, day);
}

function getNextJLPTExam(timestamp = Date.now()) {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "Asia/Shanghai",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date(timestamp));
  const value = (type) => Number(parts.find((part) => part.type === type)?.value);
  const month = String(value("month")).padStart(2, "0");
  const day = String(value("day")).padStart(2, "0");
  const todayDate = `${value("year")}-${month}-${day}`;
  const todayUtc = utcDayFromISO(todayDate);
  const sortedSchedule = [...JLPT_EXAM_SCHEDULE]
    .sort((left, right) => utcDayFromISO(left) - utcDayFromISO(right));
  const nextExamDate = sortedSchedule.find((date) => utcDayFromISO(date) >= todayUtc);
  if (!nextExamDate) return null;

  return {
    date: nextExamDate,
    days: Math.round((utcDayFromISO(nextExamDate) - todayUtc) / DAY_MS)
  };
}

function renderCountdown() {
  try {
    const nextExam = getNextJLPTExam();
    if (!nextExam) {
      elements.countdownDays.textContent = "--";
      elements.countdownLabel.textContent = "待公布";
      elements.countdownDate.textContent = "";
      elements.countdownCard.setAttribute("aria-label", "下一场 JLPT 考试日期待公布");
      return;
    }

    const shortDate = nextExam.date.slice(5).replace("-", ".");
    elements.countdownDays.textContent = String(nextExam.days);
    elements.countdownDate.textContent = nextExam.days === 0 ? "" : shortDate;
    elements.countdownLabel.textContent = nextExam.days === 0 ? "今日 JLPT" : "距 JLPT ·";
    elements.countdownCard.setAttribute(
      "aria-label",
      nextExam.days === 0
        ? `今天是 ${nextExam.date}，JLPT 考试日`
        : `距离 ${nextExam.date} 的 JLPT 考试还有 ${nextExam.days} 天`
    );
  } catch {
    elements.countdownDays.textContent = "--";
    elements.countdownLabel.textContent = "待公布";
    elements.countdownDate.textContent = "";
    elements.countdownCard.setAttribute("aria-label", "下一场 JLPT 考试日期待公布");
  }
}

function scheduleCountdownRefresh() {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "Asia/Shanghai",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hourCycle: "h23"
  }).formatToParts(new Date()).reduce((result, part) => {
    result[part.type] = part.value;
    return result;
  }, {});
  const elapsed = Number(parts.hour) * 3600 + Number(parts.minute) * 60 + Number(parts.second);
  const delay = Math.max(1000, (DAY_MS / 1000 - elapsed + 1) * 1000);
  window.setTimeout(() => {
    renderCountdown();
    scheduleCountdownRefresh();
  }, delay);
}

function previewMarkup(question, session) {
  let output = escapeHtml(question.before.trim());
  const seen = new Set();
  for (let index = 0; index < 4; index += 1) {
    const blockId = session.slots[index];
    if (!blockId) {
      output += '<span class="preview-blank">____</span>';
      continue;
    }
    if (seen.has(blockId)) continue;
    seen.add(blockId);
    const block = blockById(session, blockId);
    for (const optionId of block.members) {
      const option = optionById(question, optionId);
      output += `<span>${highlightedText(option.text, option.highlights)}</span>`;
    }
  }
  return output + escapeHtml(question.after.trim());
}

function compactSentenceMarkup(question, session) {
  let cells = "";
  const seen = new Set();
  for (let index = 0; index < 4; index += 1) {
    const blockId = session.slots[index];
    if (!blockId) {
      cells += `
        <button class="inline-slot slot-cell" type="button" data-slot="${index}"
          style="grid-row:2;grid-column:${index + 1}"
          aria-label="第${index + 1}个空位，空"></button>
      `;
      continue;
    }
    if (seen.has(blockId)) continue;
    seen.add(blockId);
    const block = blockById(session, blockId);
    const selected = session.selectedBlockIds.includes(blockId);
    cells += `
      <button
        class="inline-slot slot-cell is-filled${block.kind === "composite" ? " is-composite" : ""}${selected ? " is-selected" : ""}"
        type="button"
        draggable="true"
        data-slot="${index}"
        data-drag-block="${blockId}"
        data-block-id="${blockId}"
        style="grid-row:2;grid-column:${index + 1} / span ${blockSize(block)}"
        aria-label="${block.kind === "composite" ? `组合块${block.id}，成员${block.members.join("、")}` : `已放选项${blockId}`}"
      >${blockLabel(block)}</button>
    `;
  }

  return `
    ${escapeHtml(question.before.trim())}
    <span class="slot-grid" aria-label="四个排序空位">
      <span class="slot-star" aria-label="第三个空位★">★</span>
      ${cells}
    </span>
    ${escapeHtml(question.after.trim())}
  `;
}

function cardMarkup(question, session, block) {
  const selected = session.selectedBlockIds.includes(block.id);
  if (block.kind === "composite") {
    return `
      <button

        type="button"
        draggable="true"

  const option = optionById(question, block.members[0]);

function nextComboLetter(session) {
  return ["A", "B", "C"].find((letter) => !session.blocks[letter]) || null;
}

function comboListMarkup(question, session) {
  const composites = Object.values(session.blocks)
    .filter((block) => block.kind === "composite")
    .sort((a, b) => a.id.localeCompare(b.id));
  if (composites.length === 0) {
    return '<p class="combo-empty">选择 2—4 张卡片后，可在这里按点击顺序建立组合。</p>';
  }
  return composites.map((block) => `
    <div class="combo-item">
      <span class="combo-name">${block.id}</span>
      <span class="combo-item-copy">
        ${block.id} = ${block.members.join("")} · ${escapeHtml(blockText(question, block))}
        · ${isBlockPlaced(session, block.id) ? "已放入" : "待放置"}

    </div>

function sortStatusText(session) {
  if (session.message) return session.message;
  if (session.displayResult === "revealed") return "已查看答案并记为错误；修改排列后可再次检查。";
  const selected = session.selectedBlockIds.map((id) => blockById(session, id)).filter(Boolean);
  if (selected.length > 1) {
    return `已按顺序选择 ${selected.map((block) => block.id).join(" → ")}；可以点“组合”，或只保留一张卡再放入空位。`;
  }
  if (selected.length === 1) {
    const block = selected[0];
    return `已选中 ${blockLabel(block)}，请点一个合适位置；${blockSize(block)} 张卡需要连续空位。`;
  }
  const count = flattenSlotMembers(session).length;
  if (count < 4) return `还需放入 ${4 - count} 张卡片。拖动卡片，或点卡片后再点空位。`;
  if (session.displayResult === "wrong") return "最近一次排列错误；可继续调整后再次检查。";
  return "四个空位已填满，可以检查排列。";
}

function correctSentenceMarkup(question) {
  let cursor = 0;
  let output = "";
  for (const optionId of question.solution) {
    const option = optionById(question, optionId);
    const found = question.exactSentence.indexOf(option.text, cursor);
    if (found === -1) {
      output += escapeHtml(question.exactSentence.slice(cursor));
      return output;
    }
    output += escapeHtml(question.exactSentence.slice(cursor, found));
    output += highlightedText(option.text, option.highlights);
    cursor = found + option.text.length;
  }
  return output + escapeHtml(question.exactSentence.slice(cursor));
}

function renderExamFeedback(question, session) {
  if (!session.latestResult) {
    return '<p class="exam-instruction">点击一个选项后立即判定，不需要二次提交。</p>';
  }

function mathPermutations(values) {
  if (values.length <= 1) return [values.slice()];
  const output = [];
  values.forEach((value, index) => {
    const rest = values.slice(0, index).concat(values.slice(index + 1));
    mathPermutations(rest).forEach((tail) => output.push([value].concat(tail)));
  });
  return output;
}

const MATH_PERMUTATIONS = mathPermutations([1, 2, 3, 4]);

function createMathSession() {
  return {
    manualBlocked: MATH_POSITIONS.map(() => new Set()),
    selected: MATH_POSITIONS.map(() => null),
    assigned: MATH_POSITIONS.map(() => null),
    constraints: [],
    clueStep: 0,
    finished: false,
    won: false,
    probabilityAtFinish: null,
    starProbabilityAtAssignment: null,
    lockDraft: { first: null, second: null },
    lockKind: "positive",
    status: "",
    showVerdict: false
  };
}

function getMathSession(id) {
  if (!state.mathSessions[id]) state.mathSessions[id] = createMathSession();
  return state.mathSessions[id];
}

function mathClues(question) {
  if (Array.isArray(question.mathClues) && question.mathClues.length) {
    return question.mathClues;
  }
  if (question.session === "2026.7" && MATH_CLUES[question.number]) {
    return MATH_CLUES[question.number];
  }
  return [
    {
      title: "固定后文",
      body: `先确认固定后文「${question.after.trim()}」需要什么接续，再检查哪个选项能够直接落在它前面。`
    },
    {
      title: "相邻连接",
      body: "重点检查助词、句尾形式和固定后文之间的接续，不要只按单个词义排除。"
    }
  ];
}

function mathValidPermutations(question, session, constraints = session.constraints) {
  return MATH_PERMUTATIONS.filter((permutation) => {
    for (let position = 0; position < 4; position += 1) {
      if (session.assigned[position] !== null && permutation[position] !== session.assigned[position]) {
        return false;
      }
      if (session.manualBlocked[position].has(permutation[position])) return false;
    }
    return constraints.every((constraint) => {
      const firstIndex = permutation.indexOf(constraint.first);
      const adjacent = firstIndex >= 0
        && firstIndex < 3
        && permutation[firstIndex + 1] === constraint.second;
      return constraint.forbidden ? !adjacent : adjacent;
    });
  });
}

function mathCandidateState(question, session, position, optionId) {
  if (session.assigned[position] === optionId) return "assigned";
  if (session.assigned[position] !== null) return "auto-blocked";
  const assignedElsewhere = session.assigned.some((assignedId, index) =>
    index !== position && assignedId === optionId
  );
  if (assignedElsewhere) return "auto-blocked";
  if (session.manualBlocked[position].has(optionId)) return "manual-blocked";
  const valid = mathValidPermutations(question, session);
  if (!valid.length || !valid.some((permutation) => permutation[position] === optionId)) {
    return "auto-blocked";
  }
  return "available";
}

function mathAvailableIds(question, session, position) {
  return question.options
    .filter((option) => mathCandidateState(question, session, position, option.id) === "available")
    .map((option) => option.id);
}

function mathStarSnapshot(question, session) {
  const valid = mathValidPermutations(question, session);
  if (!valid.length) {
    return { optionId: null, percent: 0, count: 0, total: 0, counts: new Map() };
  }
  const counts = new Map(question.options.map((option) => [option.id, 0]));
  valid.forEach((permutation) => {
    const id = permutation[question.starSlot];
    counts.set(id, counts.get(id) + 1);
  });
  const preferred = session.assigned[question.starSlot]
    ?? session.selected[question.starSlot]
    ?? [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0] - b[0])[0][0];
  return {
    optionId: preferred,
    percent: Math.round(((counts.get(preferred) || 0) / valid.length) * 100),
    count: counts.get(preferred) || 0,
    total: valid.length,
    counts
  };
}

function mathOptionProbability(question, session, optionId) {
  const valid = mathValidPermutations(question, session);
  if (!valid.length) return 0;
  const count = valid.filter((permutation) => permutation[question.starSlot] === optionId).length;
  return Math.round((count / valid.length) * 100);
}

function renderMathLocks(question, session) {
  const draft = session.lockDraft;
  const numberButtons = (side) => question.options.map((option) => `
    <button class="math-lock-number${draft[side] === option.id ? " is-selected" : ""}" type="button"
      data-math-action="lock-side" data-side="${side}" data-option="${option.id}"
      aria-pressed="${draft[side] === option.id}">${option.id}</button>
  `).join("");
  const valid = mathValidPermutations(question, session);
  const chips = session.constraints.map((constraint, index) => {
    let label;
    if (constraint.forbidden) {
      label = `禁止 ${constraint.first} 后紧跟 ${constraint.second}`;
    } else {
      const starts = [...new Set(valid.map((permutation) => permutation.indexOf(constraint.first)))]
        .sort((a, b) => a - b);
      label = `${constraint.first}→${constraint.second} · ${
        starts.length ? starts.map((start) => `第${start + 1}-${start + 2}空`).join(" / ") : "无可落位置"
      }`;
    }
    return `
      <span class="math-lock-chip${constraint.forbidden ? " is-negative" : ""}">
        ${label}
        <button type="button" data-math-action="remove-lock" data-index="${index}" aria-label="删除顺序锁">×</button>
      </span>
    `;
  }).join("");
  const ready = draft.first !== null && draft.second !== null && draft.first !== draft.second;
  const resultCopy = valid.length === 1
    ? `唯一合法顺序：${valid[0].join(" → ")}`
    : valid.length
      ? `还有 ${valid.length} 种合法排列`
      : "当前条件无解";
  return `
    <div class="math-section-head">
      <h2>顺序锁</h2>
      <p>${valid.length} 种合法排列</p>
    </div>
    <div class="math-lock-layout">
      <div class="math-lock-settings">
        <div class="math-lock-mode">
          <button type="button" data-math-action="lock-kind" data-kind="positive"
            class="${session.lockKind === "positive" ? "is-active" : ""}">必须紧邻</button>

            class="${session.lockKind === "negative" ? "is-active" : ""}">禁止紧跟</button>
        </div>
        <div class="math-lock-pickers">
          <div class="math-lock-side"><span>前一项</span><div class="math-lock-numbers">${numberButtons("first")}</div></div>
          <span class="math-lock-arrow">→</span>
          <div class="math-lock-side"><span>后一项</span><div class="math-lock-numbers">${numberButtons("second")}</div></div>
        </div>
      </div>
      <div class="math-lock-results">
        <button class="math-lock-add" type="button" data-math-action="add-lock"

            ? session.lockKind === "negative"
              ? `禁止 ${draft.first} 后紧跟 ${draft.second}`
              : `锁住 ${draft.first} → ${draft.second}`
            : "先点两个编号"}
        </button>
        <div class="math-lock-list">${chips}</div>
        <p class="math-lock-result">${resultCopy}</p>
      </div>
    </div>
  `;
}

function renderMath() {
  const question = currentQuestion();
  const session = getMathSession(question.id);
  const snapshot = mathStarSnapshot(question, session);
  const starAssigned = session.assigned[question.starSlot];
  const starSelected = session.selected[question.starSlot];
  const probability = starAssigned !== null
    ? session.starProbabilityAtAssignment ?? 100
    : snapshot.percent;
  const preferredOption = snapshot.optionId === null
    ? null
    : optionById(question, snapshot.optionId);
  const clues = mathClues(question);
  const primaryDisabled = session.finished || (starAssigned === null && starSelected === null);
  const primaryText = session.finished
    ? "本局结束"
    : starAssigned !== null
      ? "收网了！"
      : starSelected !== null
        ? `指认 ${starSelected}号`
        : "先选★";
  const result = session.finished ? `
    <section class="math-result-card${session.won ? " is-win" : ""}" aria-live="polite">
      <h2>${session.won ? "猜对了" : "猜错了"}</h2>
      <p>★真正是 ${question.starOptionId}号「${escapeHtml(optionById(question, question.starOptionId).text)}」；你指认的是 ${starAssigned === null ? "未选择" : `${starAssigned}号`}。</p>
      <p>收网时命中率 ${session.probabilityAtFinish ?? 0}% · 正确顺序 ${question.solution.join(" → ")}</p>
    </section>
  ` : "";
  const verdict = session.finished && session.showVerdict ? `
    <div class="math-verdict is-visible${session.won ? "" : " is-wrong"}" role="status" aria-live="assertive">
      <span class="math-verdict-symbol" aria-hidden="true">${session.won ? "" : "×"}</span>
      <span class="sr-only">${session.won ? "猜对了" : "猜错了"}</span>
    </div>
  ` : "";

  elements.moduleContent.innerHTML = `
    ${renderQuestionToolbar()}
    <div class="math-shell">
      <div class="math-question-layout">
        <section class="math-card" aria-labelledby="mathOriginalTitle">
          <div class="math-section-head">
            <h2 id="mathOriginalTitle">原句候选</h2>
            <p>${escapeHtml(question.source)}</p>
          </div>
          <div class="math-sentence">
            ${escapeHtml(question.before.trim())}
            ${renderMathInlineSlots(question, session)}
            ${escapeHtml(question.after.trim())}
          </div>
        </section>
        <aside class="math-star-panel" aria-live="polite">
          <strong class="math-chance">${probability}%</strong>
          <p class="math-chance-label">★ 盲中率</p>
          <p class="math-chance-copy">
            ${starAssigned !== null
              ? `已拍板：${starAssigned}号「${escapeHtml(optionById(question, starAssigned).text)}」`
              : preferredOption
                ? `最可能：${preferredOption.id}号「${escapeHtml(preferredOption.text)}」`
                : "当前条件无解"}
          </p>
          <p class="math-chance-meta">
            ${starAssigned !== null
              ? `指认时锁定约 ${session.starProbabilityAtAssignment ?? 100}%`
              : `${snapshot.count} / ${snapshot.total} 种合法排列`}
          </p>
          <button class="math-primary" type="button" data-math-action="primary"
            ${primaryDisabled ? "disabled" : ""}>${primaryText}</button>
          <button class="math-reset" type="button" data-math-action="reset">重新开始</button>
        </aside>
      </div>

      <div class="math-workspace">
        <section class="math-card" aria-labelledby="mathMatrixTitle">
          <div class="math-section-head">
            <h2 id="mathMatrixTitle">先踢掉不可能的</h2>
            <p>点数字，划掉不要的</p>
          </div>
          ${renderMathMatrix(question, session)}
        </section>
        <section class="math-card math-sequence" aria-labelledby="mathLockTitle">
          <div id="mathLockTitle">${renderMathLocks(question, session)}</div>
        </section>
      </div>

      <section class="math-card math-clues" aria-labelledby="mathClueTitle">
        <div class="math-section-head">
          <h2 id="mathClueTitle">语法线索</h2>
          <p>${session.clueStep} / ${clues.length}</p>
        </div>
        <div class="math-clue-list">
          ${clues.slice(0, session.clueStep).map((clue) => `
            <article class="math-clue-item">
              <strong>${escapeHtml(clue.title)}</strong>
              <p>${escapeHtml(clue.body)}</p>
            </article>
          `).join("")}
        </div>
        <button class="math-clue-button" type="button" data-math-action="clue"
          ${session.finished || session.clueStep >= clues.length ? "disabled" : ""}>
          ${session.clueStep >= clues.length ? "线索已全部打开" : "开下一条线索"}
        </button>
      </section>

      <p class="math-status" aria-live="polite">${escapeHtml(session.status)}</p>
      ${result}
      ${questionFooterMarkup("open-evidence", "查看答案")}
      ${verdict}
    </div>
  `;
}

function mathSelectNumber(position, optionId) {
  const question = currentQuestion();
  const session = getMathSession(question.id);
  if (session.finished || mathCandidateState(question, session, position, optionId) !== "available") return;
  session.selected[position] = session.selected[position] === optionId ? null : optionId;
  session.status = session.selected[position] === null
    ? "已取消选择。"
    : `${MATH_POSITIONS[position].label}选中 ${optionId}号，点击“就它了”确认。`;
  session.showVerdict = false;
  renderMath();
}

function mathToggleBlock(position, optionId) {
  const question = currentQuestion();
  const session = getMathSession(question.id);
  if (session.finished) return;
  const candidateState = mathCandidateState(question, session, position, optionId);
  if (candidateState === "auto-blocked" || candidateState === "assigned") return;
  const blocked = session.manualBlocked[position];
  if (blocked.has(optionId)) {
    blocked.delete(optionId);
    session.status = `${MATH_POSITIONS[position].label}恢复了 ${optionId}号。`;
  } else {
    blocked.add(optionId);
    if (!mathValidPermutations(question, session).length) {
      blocked.delete(optionId);
      session.status = "这个排除会让所有排列都无解，操作已取消。";
      renderMath();
      return;
    }
    if (session.selected[position] === optionId) session.selected[position] = null;
    session.status = `${MATH_POSITIONS[position].label}排除了 ${optionId}号。`;
  }
  session.showVerdict = false;
  renderMath();
}

function mathAssignOrUndo(position) {
  const question = currentQuestion();
  const session = getMathSession(question.id);
  if (session.finished) return;
  const oldId = session.assigned[position];
  if (oldId !== null) {
    session.assigned[position] = null;
    if (position === question.starSlot) session.starProbabilityAtAssignment = null;
    session.status = `已撤销${MATH_POSITIONS[position].label}的 ${oldId}号指认。`;
    session.showVerdict = false;
    renderMath();
    return;
  }
  const optionId = session.selected[position];
  if (optionId === null) return;
  const chanceBefore = mathOptionProbability(question, session, optionId);
  session.assigned[position] = optionId;
  session.selected[position] = null;
  session.selected = session.selected.map((id) => id === optionId ? null : id);
  if (position === question.starSlot) session.starProbabilityAtAssignment = chanceBefore;
  session.status = `${MATH_POSITIONS[position].label}指认为 ${optionId}号；同一编号已从其余空位排除。`;
  session.showVerdict = false;
  renderMath();
}

function mathAddConstraint() {
  const question = currentQuestion();
  const session = getMathSession(question.id);
  if (session.finished) return;
  const { first, second } = session.lockDraft;
  if (first === null || second === null || first === second) return;
  const forbidden = session.lockKind === "negative";
  if (session.constraints.some((constraint) =>
    constraint.first === first
    && constraint.second === second
    && constraint.forbidden === forbidden
  )) {
    session.status = "这条顺序关系已经存在。";
    renderMath();
    return;
  }
  const trial = session.constraints.concat({ first, second, forbidden });
  if (!mathValidPermutations(question, session, trial).length) {
    session.status = `${first}${forbidden ? " 后不能紧跟 " : "→"}${second} 与当前条件冲突，加入后无解。`;
    renderMath();
    return;
  }
  session.constraints = trial;
  session.lockDraft = { first: null, second: null };
  session.status = forbidden
    ? `已禁止 ${second} 紧跟在 ${first} 后面。`
    : `已锁住紧邻顺序 ${first}→${second}。`;
  session.showVerdict = false;
  renderMath();
}

function mathRemoveConstraint(index) {
  const question = currentQuestion();
  const session = getMathSession(question.id);
  if (session.finished) return;
  const removed = session.constraints.splice(index, 1)[0];
  if (!removed) return;
  session.status = `已移除 ${removed.first} 与 ${removed.second} 的顺序关系。`;
  session.showVerdict = false;
  renderMath();
}

function mathOpenClue() {
  const question = currentQuestion();
  const session = getMathSession(question.id);
  const clues = mathClues(question);
  if (session.finished || session.clueStep >= clues.length) return;
  session.clueStep += 1;
  session.status = "线索已打开；候选和概率保持不变。";
  session.showVerdict = false;
  renderMath();
}

function mathPrimaryAction() {
  const question = currentQuestion();
  const session = getMathSession(question.id);
  if (session.finished) return;
  if (session.assigned[question.starSlot] !== null) {
    session.finished = true;
    session.won = session.assigned[question.starSlot] === question.starOptionId;
    session.probabilityAtFinish = session.starProbabilityAtAssignment
      ?? mathStarSnapshot(question, session).percent;
    session.showVerdict = true;
    session.status = session.won ? "收网成功！" : "收网结束。";
    setLatestResult(question.id, session.won ? "correct" : "wrong", "math");
    renderMath();
    return;
  }
  if (session.selected[question.starSlot] !== null) {
    mathAssignOrUndo(question.starSlot);
  }
}

function mathReset() {
  const question = currentQuestion();
  state.mathSessions[question.id] = createMathSession();
  renderMath();
}

function handleMathAction(button) {
  const action = button.dataset.mathAction;
  const question = currentQuestion();
  const session = getMathSession(question.id);
  switch (action) {
    case "select":
      mathSelectNumber(Number(button.dataset.position), Number(button.dataset.option));
      break;
    case "block":
      mathToggleBlock(Number(button.dataset.position), Number(button.dataset.option));
      break;
    case "assign":
      mathAssignOrUndo(Number(button.dataset.position));
      break;
    case "lock-side":
      session.lockDraft[button.dataset.side] = Number(button.dataset.option);
      session.status = "";
      session.showVerdict = false;
      renderMath();
      break;
    case "lock-kind":
      session.lockKind = button.dataset.kind;
      session.status = "";
      session.showVerdict = false;
      renderMath();
      break;
    case "add-lock":
      mathAddConstraint();
      break;
    case "remove-lock":
      mathRemoveConstraint(Number(button.dataset.index));
      break;
    case "clue":
      mathOpenClue();
      break;
    case "primary":
      mathPrimaryAction();
      break;
    case "reset":
      mathReset();
      break;
  }
}

function arrangementLabel(question) {
  const sortSession = state.sortSessions[question.id];
  if (sortSession) {
    const arrangement = arrangementBySlot(sortSession);
    if (arrangement.some(Boolean)) {
      return arrangement.map((id) => id ?? "____").join(" → ");
    }
  }
  const examSession = state.examSessions[question.id];
  if (examSession?.choice) return `真题选择：编号 ${examSession.choice}`;
  if (examSession?.revealed) return "真题查看了答案";
  return "尚未形成排序排列";
}

function renderWrongReview() {
  const wrongQuestions = questions.filter((question) => state.statuses[question.id] === "wrong");
  const correctCount = questions.filter((question) => state.statuses[question.id] === "correct").length;
  const answeredCount = wrongQuestions.length + correctCount;
  const accuracy = answeredCount ? Math.round((correctCount / answeredCount) * 100) : 0;
  const mathStarted = Object.values(state.mathSessions).filter((session) =>
    session.finished
    || session.clueStep > 0
    || session.assigned.some((id) => id !== null)
    || session.constraints.length > 0
  ).length;
  const wrongBars = wrongQuestions.map((question) => `
    <div class="record-bar-row">
      <span>${question.session} · 第${question.number}题</span>
      <span class="record-bar-track"><i style="width:100%"></i></span>
      <b>1</b>
    </div>
  `).join("");
  const wrongList = wrongQuestions.map((question) => {
    const index = getQuestionIndexById(question.id);
    return `
      <article class="wrong-item">
        <span class="wrong-number">${question.number}</span>
        <div>
          <p class="wrong-state">${question.session} · 最近一次结果错误</p>
          <p class="wrong-star">当前排列：${escapeHtml(arrangementLabel(question))}</p>
          <p class="wrong-star">★ 正确编号 ${question.starOptionId} · ${escapeHtml(optionById(question, question.starOptionId).text)}</p>
        </div>
        <div class="wrong-actions">
          <button class="small-button" type="button" data-action="resort-question" data-question-index="${index}">重新排序</button>
          <button class="small-button" type="button" data-action="open-wrong-evidence" data-question-index="${index}">查看证据</button>
        </div>
      </article>
    `;
  }).join("");

  elements.moduleContent.innerHTML = `
    <div class="record-shell">
      <div class="record-stats">
        <div class="record-stat"><span>当前已判断</span><b>${answeredCount} / ${questions.length}</b></div>
        <div class="record-stat"><span>当前正确率</span><b>${accuracy}%</b></div>
        <div class="record-stat"><span>待复习</span><b>${wrongQuestions.length}</b></div>
        <div class="record-stat"><span>已掌握</span><b>${correctCount}</b></div>
        <div class="record-stat"><span>数学练习</span><b>${mathStarted}</b></div>
        <div class="record-stat"><span>本批题数</span><b>${questions.length}</b></div>
      </div>
      <section class="record-panel">
        <h2>主要错误类型</h2>
        ${wrongBars ? `<div class="record-bars">${wrongBars}</div>` : '<p class="record-empty">目前没有待复习题目。</p>'}
      </section>
      <section class="record-panel">
        <h2>错题本</h2>
        ${wrongList ? `<div class="wrong-list">${wrongList}</div>` : '<p class="record-empty">最近一次结果都为正确，暂时没有错题。</p>'}
      </section>
    </div>
    ${questionFooterMarkup("open-evidence", "查看答案")}
  `;
}

function renderModule() {
  switch (state.module) {
    case "exam":
      renderExam();
      break;
    case "evidence":
      renderEvidence();
      break;
    case "math":
      renderMath();
      break;
    case "wrong":
      renderWrongReview();
      break;
    default:
      renderSort();
  }
}

function searchableText(question) {
  return [
    question.session,
    question.id,
    question.before,
    question.after,
    question.exactSentence,
    question.translation,
    ...question.options.map((option) => option.text),
    ...question.reasoningSteps.flatMap((step) => [
      step.title,
      step.focus,
      step.evidence,
      step.conclusion,
      step.reason
    ]),
    ...question.evidence.flashcards.flatMap((card) => Object.values(card)),
    ...Object.values(question.evidence)
  ].join(" ").toLowerCase();
}

function renderSidebar() {
  const query = state.searchQuery.trim().toLowerCase();
  const matches = questions.filter((question) => !query || searchableText(question).includes(query));
  const activeModule = INDEX_MODULES[state.indexModule] || INDEX_MODULES.sort;
  const statusMap = activeModule.statuses();
  const correctCount = questions.filter((question) => statusMap[question.id] === "correct").length;
  const wrongCount = questions.filter((question) => statusMap[question.id] === "wrong").length;
  const unansweredCount = questions.length - correctCount - wrongCount;
  const groups = [];
  for (const question of matches) {
    let group = groups.find((item) => item.session === question.session);
    if (!group) {
      group = { session: question.session, questions: [] };
      groups.push(group);
    }
    group.questions.push(question);
  }
  elements.questionIndex.innerHTML = `
    <nav class="index-module-tabs" aria-label="索引状态模块">
      ${Object.entries(INDEX_MODULES).map(([moduleName, config]) => `
        <button
          class="index-module-tab${state.indexModule === moduleName ? " is-active" : ""}"
          type="button"
          data-index-module="${moduleName}"
          aria-pressed="${state.indexModule === moduleName}"
        >${config.label}</button>
      `).join("")}
    </nav>
    <p class="index-module-summary">
      <span><strong>${activeModule.label}</strong></span>
      <span>正确 ${correctCount}</span>
      <span>错误 ${wrongCount}</span>
      <span>未做 ${unansweredCount}</span>
    </p>
    ${groups.map((group) => `
      <section class="index-group" aria-label="${group.session}">
        <div class="index-group-head">
          <h3>${group.session}</h3>
          <span>${group.questions.length} 题</span>
        </div>
        <div class="index-grid">
          ${group.questions.map((question) => {
            const index = getQuestionIndexById(question.id);
            const isCurrent = index === state.currentIndex;
            const status = statusMap[question.id];
            const classes = [
              "index-button",
              status === "wrong" ? "is-wrong" : "",
              status === "correct" ? "is-correct" : "",
              isCurrent ? "is-current" : ""
            ].filter(Boolean).join(" ");
            const statusLabel = status === "correct"
              ? `，${activeModule.label}最近一次正确`
              : status === "wrong"
                ? `，${activeModule.label}最近一次错误`
                : `，${activeModule.label}尚未作答`;
            return `
              <button class="${classes}" type="button" data-question-index="${index}"
                aria-label="${question.session}第${question.number}题${isCurrent ? "，当前题" : ""}${statusLabel}"
                aria-current="${isCurrent ? "true" : "false"}">${question.number}</button>
            `;
          }).join("")}
        </div>
      </section>
    `).join("")}
    ${matches.length === 0 ? '<p class="index-empty">没有匹配的题目</p>' : ""}
    <div class="index-legend" aria-label="状态说明">
      <span class="legend-item"><i class="legend-dot current"></i>当前</span>
      <span class="legend-item"><i class="legend-dot solved"></i>${activeModule.label}正确</span>
      <span class="legend-item"><i class="legend-dot wrong"></i>${activeModule.label}错误</span>
    </div>
  `;
}

function render() {
  renderHeader();
  renderModule();
  renderSidebar();
}

function selectQuestion(index) {
  if (!Number.isInteger(index) || index < 0 || index >= questions.length) return;
  if (state.module === "math") {
    const oldQuestion = currentQuestion();
    const oldSession = getMathSession(oldQuestion.id);
    oldSession.showVerdict = false;
  }
  state.currentIndex = index;
  render();
  closeDrawer();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function navigateQuestion(direction) {
  const target = state.currentIndex + direction;
  if (target < 0 || target >= questions.length) return;
  if (state.module === "math") {
    const oldQuestion = currentQuestion();
    const oldSession = getMathSession(oldQuestion.id);
    oldSession.showVerdict = false;
  }
  state.currentIndex = target;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function toggleBlockSelection(blockId) {
  const session = getSortSession(currentQuestion().id);
  const block = blockById(session, blockId);
  if (!block || isBlockPlaced(session, blockId)) {
    session.selectedBlockIds = [blockId];
    session.message = "";
    renderSort();
    return;
  }

  const selected = session.selectedBlockIds;
  if (selected.includes(blockId)) {
    session.selectedBlockIds = selected.filter((id) => id !== blockId);
    session.message = "";
    renderSort();
    return;
  }

  if (block.kind === "composite" || selected.some((id) => blockById(session, id)?.kind === "composite")) {
    session.selectedBlockIds = [blockId];
    session.message = "";
    renderSort();
    return;
  }

  if (selected.length >= 4) {
    session.message = "最多选择四张卡。";
    renderSort();
    return;
  }

  session.selectedBlockIds = [...selected, blockId];
  session.message = "";
  renderSort();
}

function placeBlockAt(blockId, startSlot) {
  const session = getSortSession(currentQuestion().id);
  const block = blockById(session, blockId);
  session.message = "";
  if (!block) return;
  const size = blockSize(block);

  if (!Number.isInteger(startSlot) || startSlot < 0 || startSlot + size > 4) {
    session.message = block.kind === "composite"
      ? "这里放不下这个组合"
      : "这个位置放不下一张卡片";
    renderSort();
    return;
  }

  const currentStart = findBlockStart(session, blockId);
  if (currentStart === startSlot) {
    session.selectedBlockIds = [];
    renderSort();
    return;
  }

  const targetId = session.slots[startSlot];
  if (targetId && targetId !== blockId) {
    const targetBlock = blockById(session, targetId);
    if (
      currentStart !== -1
      && size === 1
      && blockSize(targetBlock) === 1
    ) {
      session.slots[currentStart] = targetId;
      session.slots[startSlot] = blockId;
      session.selectedBlockIds = [];
      session.displayResult = null;
      validateSortSession(session);
      renderSort();
      return;
    }
    session.message = block.kind === "composite"
      ? "这里放不下这个组合"
      : "这个空位已有卡片";
    renderSort();
    return;
  }

  if (targetId === blockId && currentStart !== -1) {
    session.message = block.kind === "composite" ? "这里放不下这个组合" : "这个位置已有卡片";
    renderSort();
    return;
  }

  const oldSlots = [...session.slots];
  if (currentStart !== -1) {
    for (let index = currentStart; index < currentStart + size; index += 1) {
      session.slots[index] = null;
    }
  }

  const range = session.slots.slice(startSlot, startSlot + size);
  if (range.some(Boolean)) {
    session.slots = oldSlots;
    session.message = block.kind === "composite"
      ? "这里放不下这个组合"
      : "这个空位已有卡片";
    renderSort();
    return;
  }

  for (let index = startSlot; index < startSlot + size; index += 1) {
    session.slots[index] = blockId;
  }
  session.availableBlockIds = session.availableBlockIds.filter((id) => id !== blockId);
  session.selectedBlockIds = [];
  session.displayResult = null;
  validateSortSession(session);
  renderSort();
}

function returnBlock(blockId) {
  const session = getSortSession(currentQuestion().id);
  const block = blockById(session, blockId);
  if (!block) return;
  const start = findBlockStart(session, blockId);
  if (start !== -1) {
    for (let index = 0; index < 4; index += 1) {
      if (session.slots[index] === blockId) session.slots[index] = null;
    }
  }
  if (!session.availableBlockIds.includes(blockId)) {
    session.availableBlockIds.push(blockId);
  }
  session.selectedBlockIds = [];
  session.displayResult = null;
  session.message = "";
  validateSortSession(session);
  renderSort();
}

function activateSlot(slotIndex) {
  if (Date.now() < state.suppressClickUntil) return;
  const session = getSortSession(currentQuestion().id);
  const blockId = session.slots[slotIndex];

  if (session.selectedBlockIds.length === 1) {
    placeBlockAt(session.selectedBlockIds[0], slotIndex);
    return;
  }

  if (session.selectedBlockIds.length > 1) {
    session.message = "已选择多张卡片，请先点“组合”。";
    renderSort();
    return;
  }

  if (blockId) {
    session.selectedBlockIds = [blockId];
    session.message = "";
    renderSort();
  } else {
    session.message = "先选择一张卡片或组合块，再点空位。";
    renderSort();
  }
}

function createComposite() {
  const session = getSortSession(currentQuestion().id);
  const selectedIds = [...session.selectedBlockIds];
  const selectedBlocks = selectedIds.map((id) => blockById(session, id)).filter(Boolean);
  if (selectedBlocks.length < 2 || selectedBlocks.length > 4) {
    session.message = "请按顺序选择 2—4 张单卡。";
    renderSort();
    return;
  }
  if (selectedBlocks.some((block) => block.kind !== "single" || isBlockPlaced(session, block.id))) {
    session.message = "只能使用尚未放入句子的单卡组合。";
    renderSort();
    return;
  }
  const letter = nextComboLetter(session);
  if (!letter) {
    session.message = "A/B/C 已用完，请先拆分一个组合。";
    renderSort();
    return;
  }

  const members = selectedBlocks.flatMap((block) => block.members);
  session.blocks[letter] = { id: letter, kind: "composite", members };
  for (const id of selectedIds) delete session.blocks[id];
  session.availableBlockIds = session.availableBlockIds
    .filter((id) => !selectedIds.includes(id));
  session.availableBlockIds.push(letter);
  session.selectedBlockIds = [];
  session.message = "";
  session.displayResult = null;
  validateSortSession(session);
  renderSort();
}

function splitComposite(blockId) {
  const session = getSortSession(currentQuestion().id);
  const block = blockById(session, blockId);
  if (!block || block.kind !== "composite") return;

  for (let index = 0; index < 4; index += 1) {
    if (session.slots[index] === blockId) session.slots[index] = null;
  }
  delete session.blocks[blockId];
  const remainingAvailable = session.availableBlockIds.filter((id) => id !== blockId);
  session.availableBlockIds = [
    ...block.members.map(String),
    ...remainingAvailable
  ];
  for (const optionId of block.members) {
    session.blocks[String(optionId)] = {
      id: String(optionId),
      kind: "single",
      members: [optionId]
    };
  }
  session.selectedBlockIds = [];
  session.displayResult = null;
  session.message = "";
  validateSortSession(session);
  renderSort();
}

function checkSort() {
  const question = currentQuestion();
  const session = getSortSession(question.id);
  const arranged = flattenSlotMembers(session);
  if (arranged.length !== 4) {
    session.message = "四个空位必须全部填满后才能检查。";
    renderSort();
    return;
  }
  const correct = arranged.every((id, index) => id === question.solution[index]);
  session.latestResult = correct ? "correct" : "wrong";
  session.displayResult = session.latestResult;
  session.lastAttempt = arranged.join("");
  session.selectedBlockIds = [];
  session.message = "";
  setLatestResult(question.id, session.latestResult, "sort");
  renderModule();
  renderSidebar();
}

function revealSortAnswer() {
  const question = currentQuestion();
  const session = getSortSession(question.id);
  const arranged = flattenSlotMembers(session);
  session.latestResult = "wrong";
  session.displayResult = "revealed";
  session.lastAttempt = arranged.join("");
  session.selectedBlockIds = [];
  session.message = "";
  setLatestResult(question.id, "wrong", "sort");
  renderModule();
  renderSidebar();
}

function resetSort() {
  const id = currentQuestion().id;
  state.sortSessions[id] = createSortSession();
  state.sortSessions[id].latestResult = state.statuses[id] || null;
  validateSortSession(state.sortSessions[id]);
  renderSort();
}

function chooseExamOption(optionId) {
  const question = currentQuestion();
  const session = getExamSession(question.id);
  session.choice = optionId;
  session.revealed = false;
  session.latestResult = optionId === question.starOptionId ? "correct" : "wrong";
  setLatestResult(question.id, session.latestResult, "exam");
  renderExam();
  renderSidebar();
}

function revealExamAnswer() {
  const question = currentQuestion();
  const session = getExamSession(question.id);
  if (session.latestResult === "correct" || session.revealed) return;
  session.revealed = true;
  session.latestResult = "wrong";
  setLatestResult(question.id, "wrong", "exam");
  renderExam();
  renderSidebar();
}

function toggleFlashcard(index) {
  const question = currentQuestion();
  const validIndex = Number.isInteger(index)
    && index >= 0
    && index < question.evidence.flashcards.length;
  if (!validIndex) return;
  state.openFlashcards[question.id] = state.openFlashcards[question.id] === index ? null : index;
  renderEvidence();
}

function openEvidenceCard(cardId) {
  const targetQuestionIndex = questions.findIndex((question) =>
    question.evidence.flashcards.some((card) => card.id === cardId)
  );
  if (targetQuestionIndex < 0) return;
  const question = questions[targetQuestionIndex];
  const cardIndex = question.evidence.flashcards.findIndex((card) => card.id === cardId);
  state.currentIndex = targetQuestionIndex;
  state.openFlashcards[question.id] = cardIndex;
  state.module = "evidence";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function openModule(module) {
  if (!moduleMeta[module]) return;
  if (module === "evidence" && state.module !== "evidence") {
    state.openFlashcards[currentQuestion().id] = null;
  }
  if (module === "math" && state.module !== "math") {
    getMathSession(currentQuestion().id).showVerdict = false;
  }
  state.module = module;
  if (module in INDEX_MODULES) state.indexModule = module;
  render();
}

function openDrawer() {
  elements.indexSidebar.classList.add("is-open");
  elements.drawerBackdrop.classList.add("is-open");
  elements.indexToggle.setAttribute("aria-expanded", "true");
  document.body.classList.add("drawer-open");
  elements.drawerClose.focus({ preventScroll: true });
}

function closeDrawer() {
  elements.indexSidebar.classList.remove("is-open");
  elements.drawerBackdrop.classList.remove("is-open");
  elements.indexToggle.setAttribute("aria-expanded", "false");
  document.body.classList.remove("drawer-open");
}

function handleAction(action, target) {
  const session = getSortSession(currentQuestion().id);
  switch (action) {
    case "previous-question":
      navigateQuestion(-1);
      break;
    case "next-question":
      navigateQuestion(1);
      break;
    case "hint":
      session.hintsShown = Math.min(3, session.hintsShown + 1);
      session.message = "";
      renderSort();
      break;
    case "reset-sort":
      resetSort();
      break;
    case "check-sort":
      checkSort();
      break;
    case "view-answer":
      revealSortAnswer();
      break;
    case "view-exam-answer":
      revealExamAnswer();
      break;
    case "combine":
      createComposite();
      break;
    case "split-selected":
      if (session.selectedBlockIds.length === 1) splitComposite(session.selectedBlockIds[0]);
      break;
    case "split-combo":
      splitComposite(target.dataset.blockId);
      break;
    case "toggle-flashcard":
      toggleFlashcard(Number(target.dataset.flashcardIndex));
      break;
    case "open-evidence-card":
      openEvidenceCard(target.dataset.cardId);
      break;
    case "reveal-evidence": {
      const question = currentQuestion();
      if (!Number.isInteger(state.openFlashcards[question.id])) {
        state.openFlashcards[question.id] = 0;
        renderEvidence();
      }
      break;
    }
    case "open-evidence":
      openModule("evidence");
      break;
    case "resort-question": {
      const index = Number(target.dataset.questionIndex);
      if (Number.isInteger(index)) {
        state.currentIndex = index;
        state.module = "sort";
        render();
      }
      break;
    }
    case "open-wrong-evidence": {
      const index = Number(target.dataset.questionIndex);
      if (Number.isInteger(index)) {
        state.currentIndex = index;
        state.module = "evidence";
        render();
      }
      break;
    }
  }
}

elements.moduleContent.addEventListener("click", (event) => {
  const mathAction = event.target.closest("[data-math-action]");
  if (mathAction) {
    handleMathAction(mathAction);
    return;
  }

  const card = event.target.closest("[data-card-block]");
  if (card) {
    if (Date.now() < state.suppressClickUntil) return;
    toggleBlockSelection(card.dataset.cardBlock);
    return;
  }

  const slot = event.target.closest("[data-slot]");
  if (slot) {
    activateSlot(Number(slot.dataset.slot));
    return;
  }

  const examOption = event.target.closest("[data-exam-option]");
  if (examOption) {
    chooseExamOption(Number(examOption.dataset.examOption));
    return;
  }

  const actionTarget = event.target.closest("[data-action]");
  if (actionTarget) handleAction(actionTarget.dataset.action, actionTarget);
});

elements.moduleContent.addEventListener("dblclick", (event) => {
  const placedBlock = event.target.closest("[data-slot][data-block-id]");
  if (!placedBlock) return;
  event.preventDefault();
  returnBlock(placedBlock.dataset.blockId);
});

elements.moduleTabs.addEventListener("click", (event) => {
  const tab = event.target.closest("[data-module]");
  if (tab) openModule(tab.dataset.module);
});

elements.questionIndex.addEventListener("click", (event) => {
  const moduleButton = event.target.closest("[data-index-module]");
  if (moduleButton && INDEX_MODULES[moduleButton.dataset.indexModule]) {
    state.indexModule = moduleButton.dataset.indexModule;
    renderSidebar();
    return;
  }
  const button = event.target.closest("[data-question-index]");
  if (button) selectQuestion(Number(button.dataset.questionIndex));
});

elements.questionSearch.addEventListener("input", (event) => {
  state.searchQuery = event.target.value;
  renderSidebar();
});

elements.indexToggle.addEventListener("click", openDrawer);
elements.drawerClose.addEventListener("click", closeDrawer);
elements.drawerBackdrop.addEventListener("click", closeDrawer);

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeDrawer();
});

elements.moduleContent.addEventListener("dragstart", (event) => {
  const draggable = event.target.closest("[data-drag-block]");
  if (!draggable) return;
  state.dragBlockId = draggable.dataset.dragBlock;
  event.dataTransfer.effectAllowed = "move";
  event.dataTransfer.setData("text/plain", state.dragBlockId);
  draggable.classList.add("is-dragging");
});

elements.moduleContent.addEventListener("dragend", (event) => {
  event.target.closest(".is-dragging")?.classList.remove("is-dragging");
  document.querySelectorAll(".is-drop-target").forEach((item) => item.classList.remove("is-drop-target"));
  state.dragBlockId = null;
  state.suppressClickUntil = Date.now() + 180;
});

elements.moduleContent.addEventListener("dragover", (event) => {
  const slot = event.target.closest("[data-slot]");
  const bank = event.target.closest("#optionBank");
  if (!slot && !bank) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = "move";
  if (slot) slot.classList.add("is-drop-target");
  if (bank && !slot) bank.classList.add("is-drop-target");
});

elements.moduleContent.addEventListener("dragleave", (event) => {
  event.target.closest("[data-slot]")?.classList.remove("is-drop-target");
  const bank = event.target.closest("#optionBank");
  if (bank && !bank.contains(event.relatedTarget)) bank.classList.remove("is-drop-target");
});

elements.moduleContent.addEventListener("drop", (event) => {
  const slot = event.target.closest("[data-slot]");
  const bank = event.target.closest("#optionBank");
  if (!slot && !bank) return;
  event.preventDefault();
  if (slot && state.dragBlockId) {
    placeBlockAt(state.dragBlockId, Number(slot.dataset.slot));
  } else if (bank && state.dragBlockId) {
    returnBlock(state.dragBlockId);
  }
  state.suppressClickUntil = Date.now() + 180;
});

window.addEventListener("resize", () => {
  if (window.innerWidth > 980) closeDrawer();
});

window.addEventListener("visibilitychange", () => {
  if (!document.hidden) renderCountdown();
});

loadStatuses();
renderCountdown();
render();
scheduleCountdownRefresh();

  </script>
</body>
</html>
