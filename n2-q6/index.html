const $ = (selector) => document.querySelector(selector);
const DAY = 24 * 60 * 60 * 1000;
const STORE_KEY = 'jlpt-preview-n2-q6-2026-7-v1';
const APP_TIME_ZONE = 'Asia/Shanghai';
const JLPT_EXAM_SCHEDULE = [
  '2026-12-06',
  '2027-07-04',
  '2027-12-05'
].sort();
const REVIEW_DAYS = [1, 3, 7, 14, 30];
const MATCH_MODE_LABELS = {
  exam_repair: '真题改错',
  synonym: '近义辨析',
  multi: '多解题'
};
const TWC_URL = 'https://tsukubawebcorpus.jp/search/';
const evidenceById = {};
for (const item of DATA.evidence || []) evidenceById[item.id] = item;
const questionById = {};
for (const item of DATA.questions || []) questionById[item.id] = item;

const state = {
  view: 'match',
  indexMode: 'match',
  indexQuery: '',
  filter: 'all',
  shuffle: false,
  deck: [],
  index: 0,
  answered: false,
  selected: null,
  revealedAnswer: false,
  matchDeck: [],
  matchIndex: 0,
  matchWords: [],
  matchSentences: [],
  matchAssignments: {},
  matchSelected: null,
  matchChecked: false,
  matchCorrect: false,
  matchErrorMode: false,
  matchErrorSids: [],
  cardDeck: [],
  cardIndex: 0,
  cardRevealed: false,
  activeQuestionId: ''
};

function defaultStore() {
  return {
    version: 1,
    records: {},
    today: { key: dateKey(Date.now()), attempts: 0, correct: 0 },
    matchAssignments: {},
    matchResults: {},
    matchMistakes: {},
    lastMatchId: '',
    lastEvidenceId: ''
  };
}

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return defaultStore();
    const parsed = JSON.parse(raw);
    return {
      version: 1,
      records: parsed.records || {},
      today: parsed.today || { key: dateKey(Date.now()), attempts: 0, correct: 0 },
      matchAssignments: parsed.matchAssignments || {},
      matchResults: parsed.matchResults || {},
      matchMistakes: parsed.matchMistakes || {},
      lastMatchId: parsed.lastMatchId || '',
      lastEvidenceId: parsed.lastEvidenceId || ''
    };
  } catch (error) {
    return defaultStore();
  }
}

let store = loadStore();

function dateKey(timestamp) {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: APP_TIME_ZONE,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
  }).formatToParts(new Date(timestamp));
  const value = Object.fromEntries(parts.map((part) => [part.type, part.value]));
  return value.year + '-' + value.month + '-' + value.day;
}

function dateKeyToUtc(key) {
  const [year, month, day] = key.split('-').map(Number);
  return Date.UTC(year, month - 1, day);
}

function getNextJLPTExam(timestamp = Date.now()) {
  const today = dateKey(timestamp);
  const todayUtc = dateKeyToUtc(today);
  const nextExamDate = JLPT_EXAM_SCHEDULE
    .slice()
    .sort()
    .find((date) => dateKeyToUtc(date) >= todayUtc);
  if (!nextExamDate) return null;
  return {
    date: nextExamDate,
    days: Math.round((dateKeyToUtc(nextExamDate) - todayUtc) / DAY)
  };
}

function updateCountdown(timestamp = Date.now()) {
  const nextExam = getNextJLPTExam(timestamp);
  const card = $('#examCountdown');
  const daysElement = $('#countdownDays');
  const labelElement = $('#countdownLabel');
  const dateElement = $('#countdownDate');

  if (!nextExam) {
    daysElement.textContent = '--';
    labelElement.textContent = '待公布';
    dateElement.textContent = '';
    card.setAttribute('aria-label', '下一场 JLPT 考试日期待公布');
    return;
  }

  const displayDate = nextExam.date.slice(5).replace('-', '.');
  daysElement.textContent = String(nextExam.days);
  dateElement.textContent = nextExam.days === 0 ? '' : displayDate;
  labelElement.textContent = nextExam.days === 0 ? '今日 JLPT' : '距 JLPT ·';
  card.setAttribute(
    'aria-label',
    nextExam.days === 0
      ? '今天是 ' + nextExam.date + ' JLPT 考试日'
      : '距离 ' + nextExam.date + ' 的 JLPT 考试还有 ' + nextExam.days + ' 天'
  );
}

function scheduleCountdownRefresh() {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: APP_TIME_ZONE,
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hourCycle: 'h23'
  }).formatToParts(new Date()).reduce((result, part) => {
    result[part.type] = part.value;
    return result;
  }, {});
  const elapsed = Number(parts.hour) * 3600 + Number(parts.minute) * 60 + Number(parts.second);
  const delay = Math.max(1000, (DAY / 1000 - elapsed + 1) * 1000);
  window.setTimeout(() => {
    updateCountdown();
    scheduleCountdownRefresh();
  }, delay);
}

function ensureToday() {
  const key = dateKey(Date.now());
  if (!store.today || store.today.key !== key) {
    store.today = { key, attempts: 0, correct: 0 };
  }
}

function saveStore() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
  } catch (error) {}
}

function recordFor(id) {
  if (!store.records[id]) {
    store.records[id] = {
      attempts: 0,
      correct: 0,
      wrong: 0,
      streak: 0,
      dueAt: 0,
      lastAt: 0,
      lastChoice: 0,
      starred: false
    };
  }
  return store.records[id];
}

function isDue(question) {
  const record = store.records[question.id];
  return !record || !record.dueAt || record.dueAt <= Date.now();
}

function isWrong(question) {
  return (store.records[question.id]?.wrong || 0) > 0;
}

function isStarred(question) {
  return Boolean(store.records[question.id]?.starred);
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (character) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[character]);
}

function highlightInText(text, word, explicit) {
  const escaped = escapeHtml(text);
  if (explicit) {
    const exact = escapeHtml(explicit);
    if (escaped.includes(exact)) {
      return escaped.split(exact).join('<em class="example-hit">' + exact + '</em>');
    }
  }
  const candidates = [word];
  if (word.endsWith('する')) candidates.push(word.slice(0, -2));
  if (word.endsWith('す')) candidates.push(word.slice(0, -1) + 'し');
  const target = candidates
    .map((item) => escapeHtml(item))
    .sort((a, b) => b.length - a.length)
    .find((item) => escaped.includes(item));
  if (!target) return escaped;
  return escaped.split(target).join('<em class="example-hit">' + target + '</em>');
}

function examSource(question) {
  return question.year + ' N2 · 問題6 第' + question.no + '題';
}

function shuffleInPlace(items) {
  for (let i = items.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  return items;
}

function filteredQuestions(filter) {
  let questions = DATA.questions.slice();
  if (filter === 'due') questions = questions.filter(isDue);
  if (filter === 'wrong') questions = questions.filter(isWrong);
  if (filter === 'starred') questions = questions.filter(isStarred);
  if (state.shuffle) shuffleInPlace(questions);
  return questions;
}

function rebuildDeck(filter, preserveId) {
  state.filter = filter;
  state.deck = filteredQuestions(filter);
  state.index = 0;
  if (preserveId) {
    const found = state.deck.findIndex((question) => question.id === preserveId);
    if (found >= 0) state.index = found;
  }
  state.answered = false;
  state.selected = null;
  state.revealedAnswer = false;
}

function rebuildCards() {
  const seen = new Set();
  state.cardDeck = DATA.questions.filter((question) => {
    if (seen.has(question.word)) return false;
    seen.add(question.word);
    return true;
  });
  if (state.cardIndex >= state.cardDeck.length) state.cardIndex = 0;
}

function rememberEvidencePosition() {
  const question = state.cardDeck[state.cardIndex];
  if (!question) return;
  store.lastEvidenceId = question.id;
  saveStore();
}

function currentViewQuestionId() {
  if (state.view === 'match') return state.matchDeck[state.matchIndex]?.id || '';
  if (state.view === 'practice') return state.deck[state.index]?.id || '';
  if (state.view === 'cards') return state.cardDeck[state.cardIndex]?.id || '';
  return state.activeQuestionId || '';
}

function rememberActiveQuestion(id) {
  if (!id || !questionById[id]) return;
  if (state.activeQuestionId === id &&
      store.lastMatchId === id &&
      store.lastEvidenceId === id) return;
  state.activeQuestionId = id;
  store.lastMatchId = id;
  store.lastEvidenceId = id;
  saveStore();
}

function focusEvidence(id) {
  rebuildCards();
  const source = questionById[id];
  let found = state.cardDeck.findIndex((question) => question.id === id);
  if (found < 0 && source) {
    found = state.cardDeck.findIndex((question) => question.word === source.word);
  }
  state.cardIndex = found >= 0 ? found : 0;
  return state.cardDeck[state.cardIndex] || null;
}

function selectQuestionEverywhere(id, view) {
  const question = questionById[id];
  if (!question) return;
  state.view = view;
  state.indexMode = view === 'match' ? 'match' : 'practice';
  state.matchErrorMode = false;
  state.matchErrorSids = [];
  rebuildMatch(id);
  rebuildDeck('all', id);
  focusEvidence(id);
  state.cardRevealed = false;
  rememberActiveQuestion(id);
  render();
}

function openEvidence(id) {
  state.view = 'cards';
  state.cardRevealed = true;
  focusEvidence(id);
  rememberActiveQuestion(id);
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function rebuildMatch(preserveId) {
  state.matchDeck = (DATA.matches || []).slice();
  state.matchIndex = 0;
  if (preserveId) {
    const found = state.matchDeck.findIndex((item) => item.id === preserveId);
    if (found >= 0) state.matchIndex = found;
  }
  prepareMatchQuestion();
  rememberMatchPosition();
}

function prepareMatchQuestion() {
  const match = state.matchDeck[state.matchIndex];
  if (!match) {
    state.matchWords = [];
    state.matchSentences = [];
    state.matchAssignments = {};
    state.matchSelected = null;
    state.matchChecked = false;
    state.matchCorrect = false;
    state.matchErrorMode = false;
    state.matchErrorSids = [];
    return;
  }

  state.matchWords = shuffleInPlace(
    match.pairs.map((pair) => pair.word).concat(match.decoys || [])
  );
  state.matchSentences = shuffleInPlace(
    match.pairs.map((pair, index) => ({
      sid: String(index),
      text: pair.sentence,
      right: pair.right,
      frame: pair.frame,
      accepts: pair.accepts || [pair.word],
      word: pair.word
    }))
  );

  const saved = store.matchAssignments[match.id] || {};
  state.matchAssignments = {};
  const usedWords = new Set();
  for (const sentence of state.matchSentences) {
    const word = saved[sentence.sid];
    const canRestore = state.matchWords.includes(word) &&
      (match.multi || !usedWords.has(word));
    if (canRestore) {
      state.matchAssignments[sentence.sid] = word;
      usedWords.add(word);
    }
  }
  state.matchSelected = null;
  state.matchChecked = false;
  state.matchCorrect = false;
  state.matchErrorMode = false;
  state.matchErrorSids = [];
}

function persistMatchAssignments() {
  const match = state.matchDeck[state.matchIndex];
  if (!match) return;
  store.matchAssignments[match.id] = Object.assign({}, state.matchAssignments);
  saveStore();
}

function rememberMatchPosition() {
  const match = state.matchDeck[state.matchIndex];
  if (!match) return;
  store.lastMatchId = match.id;
  saveStore();
}

function syncPracticeQuestionToMatch(question) {
  if (!question || store.lastMatchId === question.id) return;
  store.lastMatchId = question.id;
  saveStore();
}

function currentMatchSentences() {
  if (!state.matchErrorMode || !state.matchErrorSids.length) return state.matchSentences;
  return state.matchSentences.filter((sentence) => state.matchErrorSids.includes(sentence.sid));
}

function indexStatus(mode, id) {
  if (mode === 'match') {
    if (store.matchMistakes?.[id]?.unresolved) return 'wrong';
    if (store.matchResults?.[id]?.lastOk) return 'done';
  } else {
    const record = store.records?.[id];
    if (record?.wrong) return 'wrong';
    if (record?.attempts) return 'done';
  }
  return '';
}

function closeIndexPanel() {
  document.body.classList.remove('index-open');
}

function indexResultsHtml() {
  const mode = state.indexMode;
  const source = mode === 'match' ? (DATA.matches || []) : (DATA.questions || []);
  const query = state.indexQuery.trim().toLowerCase();
  const activeId = state.activeQuestionId || (mode === 'match'
    ? state.matchDeck[state.matchIndex]?.id
    : state.deck[state.index]?.id);

  const grouped = {};
  source.forEach((item) => {
    const question = questionById[item.id];
    if (!question) return;
    const haystack = [question.year, question.word, question.reading || '', item.source || '']
      .join(' ').toLowerCase();
    if (query && !haystack.includes(query)) return;
    if (!grouped[question.year]) grouped[question.year] = [];
    grouped[question.year].push(question);
  });

  const sessions = Object.keys(grouped).sort((a, b) => {
    const [ay, am] = a.split('.').map(Number);
    const [by, bm] = b.split('.').map(Number);
    return by - ay || bm - am;
  });

  return sessions.map((session) => {
    const items = grouped[session].sort((a, b) => a.no - b.no);
    const numbers = items.map((question) => {
      const status = indexStatus(mode, question.id);
      const starred = Boolean(store.records?.[question.id]?.starred);
      let classes = 'index-num';
      if (status) classes += ' ' + status;
      if (starred) classes += ' starred';
      if (question.id === activeId) classes += ' active';
      return '<button class="' + classes + '" data-index-id="' + escapeHtml(question.id) +
        '" title="' + escapeHtml(question.word) + '">' + question.no + '</button>';
    }).join('');
    return '<section class="index-group"><div class="index-session"><b>' +
      escapeHtml(session) + '</b><span>' + items.length + ' 题</span></div>' +
      '<div class="index-grid">' + numbers + '</div></section>';
  }).join('') || '<div class="index-empty">没有匹配的题目</div>';
}

function renderIndexResults() {
  const results = document.querySelector('#indexResults');
  if (results) results.innerHTML = indexResultsHtml();
}

function renderIndexPanel() {
  const panel = document.querySelector('#indexPanel');
  if (!panel) return;
  const mode = state.indexMode;

  panel.innerHTML =
    '<div class="index-head"><h2>题目索引</h2><button class="index-close" id="indexClose" aria-label="关闭">×</button></div>' +
    '<div class="index-tabs"><button class="index-tab' + (mode === 'match' ? ' on' : '') +
      '" data-index-mode="match">连线</button><button class="index-tab' +
      (mode === 'practice' ? ' on' : '') + '" data-index-mode="practice">真题</button></div>' +
    '<input class="index-search" id="indexSearch" value="' + escapeHtml(state.indexQuery) +
      '" placeholder="搜年份或词，如 2026.7 / もたらす">' +
    '<div id="indexResults">' + indexResultsHtml() + '</div>';
}

function render() {
  ensureToday();
  rememberActiveQuestion(currentViewQuestionId());
  updateCountdown();
  document.querySelectorAll('.segment').forEach((button) => {
    button.classList.toggle('on', button.dataset.view === state.view);
  });

  if (state.view === 'match') $('#app').innerHTML = renderMatch();
  if (state.view === 'practice') $('#app').innerHTML = renderPractice();
  if (state.view === 'cards') $('#app').innerHTML = renderCards();
  if (state.view === 'stats') $('#app').innerHTML = renderStats();
  renderIndexPanel();
}

function filterChip(filter, label, count) {
  return '<button class="chip' + (state.filter === filter ? ' on' : '') +
    '" data-filter="' + filter + '">' + escapeHtml(label) + ' ' + count + '</button>';
}

function renderFilters() {
  const all = DATA.questions.length;
  const due = DATA.questions.filter(isDue).length;
  const wrong = DATA.questions.filter(isWrong).length;
  const starred = DATA.questions.filter(isStarred).length;
  return '<div class="filters">' +
    filterChip('all', '全部', all) +
    filterChip('due', '待复习', due) +
    filterChip('wrong', '错题', wrong) +
    filterChip('starred', '重点', starred) +
    '</div>';
}

function renderPractice() {
  if (!state.deck.length) {
    const message = state.filter === 'wrong'
      ? '还没有错题。先去做一组题，选错的词会自动留在这里。'
      : state.filter === 'starred'
        ? '还没有标记重点。点题目右上角的星，就能单独复习。'
        : '这个筛选下暂时没有题。';
    return renderFilters() + '<section class="empty"><h2>这里还是空的</h2><p>' +
      escapeHtml(message) + '</p><button class="nav-btn primary" data-filter="all">回到全部题目</button></section>';
  }

  const question = state.deck[state.index];
  syncPracticeQuestionToMatch(question);
  const hasMatch = (DATA.matches || []).some((match) => match.id === question.id);
  const hasEvidence = (DATA.evidence || []).some((item) => item.id === question.id);
  const record = recordFor(question.id);
  const selected = state.selected;
  const answer = question.answer;
  const wordClass = question.word.length >= 6 ? ' long' : '';

  const options = question.options.map((option, index) => {
    const number = index + 1;
    let classes = 'option';
    if (state.answered) {
      if (option.correct) classes += ' correct';
      else if (number === selected) classes += ' wrong';
      else classes += ' dim';
    }
    return '<button class="' + classes + '" data-choice="' + number + '"' +
      (state.answered ? ' disabled' : '') + '>' +
      '<span class="num">' + number + '</span>' +
      '<span class="option-text">' + highlightInText(option.text, question.word, option.highlight) + '</span>' +
      '</button>';
  }).join('');

  const questionCard = '<section class="question-card">' +
    '<div class="meta-row">' +
      '<div class="meta-left">' +
        '<span class="source">' + escapeHtml(question.year + ' · 問' + question.no) + '</span>' +
        '<span class="tag">' + escapeHtml(question.category) + '</span>' +
      '</div>' +
      '<button class="star' + (record.starred ? ' on' : '') +
        '" data-action="star" aria-label="标记重点">★</button>' +
    '</div>' +
    '<div class="word-block">' +
      '<p class="word-label">次の言葉</p>' +
      '<h2 class="word' + wordClass + '">' + escapeHtml(question.word) + '</h2>' +
      '<p class="reading">' + escapeHtml(question.reading) + '</p>' +
    '</div>' +
    '<p class="instruction">次の言葉の使い方として最もよいものを、1・2・3・4から一つ選びなさい。</p>' +
    '<div class="options" role="group" aria-label="选择用法正确的句子">' + options + '</div>' +
    (hasMatch || hasEvidence
      ? '<div class="actions-row">' +
        (hasMatch
          ? '<button class="mini-btn" data-action="match-this-question">练这道题的连线</button>'
          : '') +
        (hasEvidence
          ? '<button class="mini-btn" data-action="practice-evidence">查看本题证据</button>'
          : '') +
        '</div>'
      : '') +
    (state.answered ? renderFeedback(question, selected) : '<p class="hint">选完立即判定 · 键盘 1–4</p>') +
  '</section>';

  return renderFilters() +
    '<div class="deckbar"><p>' + (state.index + 1) + ' / ' + state.deck.length +
      ' · ' + (state.revealedAnswer ? '已看答案 · 错误' : state.answered ? '已判定' : '先判断，再看解释') + '</p>' +
      '<button class="ghost' + (state.shuffle ? ' on' : '') + '" data-action="shuffle">乱序</button>' +
    '</div>' +
    questionCard +
    '<div class="bottom-nav three">' +
      '<button class="nav-btn" data-action="prev"' + (state.index === 0 ? ' disabled' : '') + '>← 上一题</button>' +
      '<button class="nav-btn" data-action="reveal-answer"' + (state.answered ? ' disabled' : '') + '>看答案</button>' +
      (state.answered
        ? '<button class="nav-btn primary" data-action="next"' +
          (state.index >= state.deck.length - 1 ? ' disabled' : '') + '>下一题 →</button>'
        : '<button class="nav-btn primary" data-action="next"' +
          (state.index >= state.deck.length - 1 ? ' disabled' : '') + '>跳过</button>') +
    '</div>';
}

function renderFeedback(question, selected) {
  const revealed = state.revealedAnswer;
  const correct = !revealed && selected === question.answer;
  const historical = revealed
    ? '查看答案，已记为错误'
    : question.firstPick
    ? '当时真题首答：' + question.firstPick +
      (question.firstPick === question.answer ? '（正确）' : '（红笔）')
    : '这次选：' + selected;

  const chunks = question.chunks.map((chunk) => {
    if (chunk.ok) {
      return '<span class="chunk ok">✓ ' + escapeHtml(chunk.text) + '</span>';
    }
    return '<span class="chunk no">× ' + escapeHtml(chunk.text) +
      ' <small>→ ' + escapeHtml(chunk.fix) + '</small></span>';
  }).join('');

  const explanations = question.options.map((option, index) => {
    const number = index + 1;
    const logic = (option.analysis || []).map((item) =>
      '<li>' + escapeHtml(item) + '</li>'
    ).join('');
    return '<div class="explain"><b>' + number + '. ' +
      highlightInText(option.text, question.word, option.highlight) + '</b><br>' +
      '<span class="option-translation">中：' + escapeHtml(option.translation) + '</span>' +
      (option.correct
        ? '✓ ' + escapeHtml(option.why)
        : '× ' + escapeHtml(option.why)) +
      (logic ? '<ol class="explain-logic">' + logic + '</ol>' : '') +
      (!option.correct && option.fix
        ? '<span class="fix">→ ' + escapeHtml(option.fix) + '</span>'
        : '') +
      '</div>';
  }).join('');

  return '<div class="feedback ' + (correct ? 'good' : 'bad') + '">' +
    '<div class="verdict"><strong>' +
      (revealed ? '看答案 · 记为错误' : correct ? '这次选对了' : '再看一眼边界') + '</strong>' +
      '<span class="history">' + escapeHtml(historical) + '</span></div>' +
    '<p class="core"><b>核心义</b>' + escapeHtml(question.core) + '</p>' +
    '<div class="chunks">' + chunks + '</div>' +
    '<p class="trap"><b>最容易错在：</b>' + escapeHtml(question.trap) + '</p>' +
    '<details><summary>四个选项逐项拆解</summary><div class="explain-list">' +
      explanations + '</div></details>' +
  '</div>';
}

function renderOriginalQuestion(match) {
  const question = questionById[match.id];
  if (!question) return '';
  const options = question.options.map((option, index) =>
    '<div class="original-option' + (option.correct ? ' correct' : '') + '">' +
      '<span class="num">' + (index + 1) + '</span>' +
      '<span>' + highlightInText(option.text, question.word, option.highlight) + '</span>' +
    '</div>'
  ).join('');
  return '<section class="study-section">' +
    '<h3 class="study-title">原题 <small>' + escapeHtml(examSource(question)) + '</small></h3>' +
    '<div class="original-options">' + options + '</div>' +
  '</section>';
}

function renderStrategy(match) {
  const words = match.pairs.map((pair) => pair.word).concat(match.decoys || []);
  const steps = words.map((word) =>
    '<li><b>' + escapeHtml(word) + '</b>：' +
      escapeHtml(match.meanings?.[word] || '') + '</li>'
  ).join('');
  return '<section class="study-section">' +
    '<h3 class="study-title">做题思路 <small>词义与使用范围</small></h3>' +
    '<ol class="strategy-list">' + steps + '</ol>' +
  '</section>';
}

function renderErrorFeedback() {
  const result = state.matchCorrect
    ? '错配已经订正，已从连线错题中移除。'
    : '还有错误搭配，继续重连。';
  return '<div class="match-feedback">' +
    '<div class="result-banner ' + (state.matchCorrect ? 'good' : 'bad') + '">' +
      result +
    '</div>' +
    '<div class="match-actions">' +
      '<button class="build-btn" data-action="match-redo">重新连线</button>' +
      '<button class="build-btn" data-action="match-exit-error">回到整题</button>' +
    '</div>' +
  '</div>';
}

function renderMatch() {
  if (!state.matchDeck.length) {
    return '<section class="empty"><h2>还没有连线题</h2><p>请在 matches.json 中加入题目。</p></section>';
  }
  if (state.matchIndex >= state.matchDeck.length) state.matchIndex = 0;

  const match = state.matchDeck[state.matchIndex];
  const entries = Object.entries(state.matchAssignments);
  const sentenceList = currentMatchSentences();
  const visibleSids = new Set(sentenceList.map((sentence) => sentence.sid));
  const visibleEntries = entries.filter(([sid]) => visibleSids.has(sid));
  const assignedCount = visibleEntries.length;
  const ready = assignedCount === sentenceList.length;
  const palette = ['#28776B', '#B98520', '#5B6FA8', '#B6534C'];
  const modeLabel = state.matchErrorMode ? '错配复习' : (MATCH_MODE_LABELS[match.mode] || '连线模式');
  const modeDescription = state.matchErrorMode
    ? '只显示上次连错的框架，已经连对的部分不重做。'
    : match.mode === 'exam_repair'
    ? '四个正确词来自本题四个选项对应的改写。'
    : match.mode === 'synonym'
      ? '五个词属于同一语义场，重点比较搭配边界。'
      : match.mode === 'multi'
        ? '多个自然搭配都成立，允许同一个词匹配多个框架。'
        : '';

  const wordButtons = state.matchWords.map((word) => {
    const entryIndex = visibleEntries.findIndex((entry) => entry[1] === word);
    const sid = entryIndex >= 0 ? visibleEntries[entryIndex][0] : null;
    const sentence = sid !== null
      ? state.matchSentences.find((item) => item.sid === sid)
      : null;
    let classes = 'match-word';
    let color = '#B8B0A4';
    if (sid !== null) {
      classes += ' assigned';
      color = palette[entryIndex % palette.length];
      if (state.matchChecked) {
        const ok = sentence && (sentence.accepts || [sentence.word]).includes(word);
        classes += ok ? ' checked ok' : ' checked no';
        color = ok ? '#2E7C59' : '#B6534C';
      }
    }
    if (state.matchSelected === word) classes += ' selected';
    return '<button class="' + classes + '" data-match-word="' + escapeHtml(word) +
      '" style="--match-color:' + color + '"' +
      (state.matchChecked ? ' disabled' : '') + '>' +
      escapeHtml(word) + '<span class="match-dot"></span></button>';
  }).join('');

  const sentenceButtons = sentenceList.map((sentence) => {
    const word = state.matchAssignments[sentence.sid];
    const entryIndex = word ? entries.findIndex((entry) => entry[0] === sentence.sid) : -1;
    let classes = 'match-sentence';
    let color = '#B8B0A4';
    if (word) {
      classes += ' assigned';
      color = palette[entryIndex % palette.length];
      if (state.matchChecked) {
        const ok = (sentence.accepts || [sentence.word]).includes(word);
        classes += ok ? ' checked ok' : ' checked no';
        color = ok ? '#2E7C59' : '#B6534C';
      }
    }
    return '<button class="' + classes + '" data-match-sentence="' + sentence.sid +
      '" style="--match-color:' + color + '"' +
      (state.matchChecked ? ' disabled' : '') + '>' +
      '<span class="match-frame">' + escapeHtml(sentence.frame) + '</span>' +
      '<span class="match-core">核心：' + escapeHtml(sentence.right) + '</span>' +
      '<span class="match-dot"></span></button>';
  }).join('');

  const correctPairs = match.pairs.map((pair) => {
    const example = pair.sentence.replace(/___/g, pair.word);
    const alternatives = (pair.accepts || []).filter((word) => word !== pair.word);
    return '<div class="match-answer-row">' +
      '<div class="match-pair"><b>' + escapeHtml(pair.word) + '</b><span>→</span>' +
        '<strong>' + escapeHtml(pair.right) + '</strong></div>' +
      '<div class="match-example">' +
        '<div class="example-meta">例句 · ' + escapeHtml(match.source) + '</div>' +
        '<p class="example-jp">' + highlightInText(example, pair.word) + '</p>' +
        (pair.translation
          ? '<p class="example-zh">中：' + escapeHtml(pair.translation) + '</p>'
          : '') +
        (alternatives.length
          ? '<p class="match-alt">也可：' + alternatives.map(escapeHtml).join('／') + '</p>'
          : '') +
      '</div>' +
    '</div>';
  }).join('');

  const boardActions = state.matchChecked
    ? ''
    : '<div class="match-actions">' +
        '<button class="build-btn" data-action="match-clear"' +
          (assignedCount ? '' : ' disabled') + '>清空</button>' +
        '<button class="build-btn primary" data-action="match-check"' +
          (ready ? '' : ' disabled') + '>检查</button>' +
      '</div>';

  const feedback = state.matchChecked
    ? state.matchErrorMode
      ? renderErrorFeedback()
      : '<div class="match-feedback">' +
        '<div class="result-banner ' + (state.matchCorrect ? 'good' : 'bad') + '">' +
          (state.matchCorrect
            ? '四组搭配都成立。' + (match.multi ? '（本题有多解）' : '')
            : '还有连接错误，已加入连线错题。') +
        '</div>' +
        (match.multi && match.multiNote
          ? '<p class="match-tip"><b>多解提示：</b>' + escapeHtml(match.multiNote) + '</p>'
          : '') +
        renderOriginalQuestion(match) +
        renderStrategy(match) +
        '<div class="decoy-explanation"><b>干扰项：' +
          escapeHtml(match.decoys.join('、')) + '</b><p>' +
          escapeHtml(match.decoyWhy || '这个词在本组中没有对应搭配。') + '</p></div>' +
        '<div class="match-answers">' + correctPairs + '</div>' +
        '<div class="actions-row">' +
          '<button class="mini-btn" data-action="open-evidence">查看「' +
            escapeHtml(match.focus) + '」完整证据</button>' +
          (!state.matchCorrect && state.matchErrorSids.length
            ? '<button class="mini-btn" data-action="match-error-mode">只练错误搭配</button>'
            : '') +
        '</div>' +
        '<div class="match-actions">' +
          '<button class="build-btn" data-action="match-redo">重新连线</button>' +
          '<button class="build-btn primary" data-action="match-next"' +
            (state.matchIndex >= state.matchDeck.length - 1 ? ' disabled' : '') +
            '>下一题 →</button>' +
        '</div>' +
      '</div>'
    : '';

  requestAnimationFrame(drawMatchLines);

  return '<div class="deckbar"><p>' + (state.matchIndex + 1) + ' / ' +
      state.matchDeck.length + ' · 5 词配 4 个搭配</p>' +
      '<span class="tag">' + escapeHtml(modeLabel) + '</span></div>' +
    '<section class="match-card">' +
      '<div class="match-head">' +
        '<div>' +
          '<p class="output-kicker">这次辨析</p>' +
          '<h2 class="match-focus">' + escapeHtml(match.focus) + '</h2>' +
          '<span class="source">' + escapeHtml(match.source) + '</span>' +
        '</div>' +
        '<span class="tag">' + escapeHtml(modeLabel) + '</span>' +
      '</div>' +
      '<p class="match-tip">' +
        (state.matchErrorMode
          ? '只显示上次连错的框架，已经连对的部分不用重做。'
          : match.multi
          ? '本题允许多个自然搭配，同一个词可以使用多次；四组连完后再检查。'
          : '先点左侧词语，再点右侧核心搭配。四组全部连完后再检查；另一个词没有对应项。') +
        (modeDescription ? '<span class="mode-note">' + escapeHtml(modeDescription) + '</span>' : '') +
      '</p>' +
      '<div class="match-board" id="matchBoard">' +
        '<svg class="match-lines" id="matchLines" aria-hidden="true"></svg>' +
        '<div class="match-column">' + wordButtons + '</div>' +
        '<div class="match-column">' + sentenceButtons + '</div>' +
      '</div>' +
      '<p class="match-progress">已连接 ' + assignedCount + ' / ' + sentenceList.length +
        (ready ? ' · 可以检查' : ' · 还差 ' + (sentenceList.length - assignedCount) + ' 组') + '</p>' +
      boardActions +
      (state.matchChecked ? feedback : '') +
    '</section>' +
    (state.matchChecked ? '' :
      '<div class="bottom-nav">' +
        '<button class="nav-btn" data-action="match-prev"' +
          (state.matchIndex === 0 ? ' disabled' : '') + '>← 上一题</button>' +
        '<button class="nav-btn" data-action="match-next"' +
          (state.matchIndex >= state.matchDeck.length - 1 ? ' disabled' : '') + '>下一题 →</button>' +
      '</div>');
}

function drawMatchLines() {
  const board = document.querySelector('#matchBoard');
  const svg = document.querySelector('#matchLines');
  if (!board || !svg) return;
  const boardRect = board.getBoundingClientRect();
  if (!boardRect.width || !boardRect.height) return;
  svg.setAttribute('viewBox', '0 0 ' + boardRect.width + ' ' + boardRect.height);

  const wordElements = Array.from(document.querySelectorAll('[data-match-word]'));
  const sentenceElements = Array.from(document.querySelectorAll('[data-match-sentence]'));
  const entries = Object.entries(state.matchAssignments);
  const palette = ['#28776B', '#B98520', '#5B6FA8', '#B6534C'];
  let markup = '';

  entries.forEach(([sid, word], index) => {
    const wordElement = wordElements.find((element) => element.dataset.matchWord === word);
    const sentenceElement = sentenceElements.find((element) => element.dataset.matchSentence === sid);
    if (!wordElement || !sentenceElement) return;
    const wordRect = wordElement.getBoundingClientRect();
    const sentenceRect = sentenceElement.getBoundingClientRect();
    const x1 = wordRect.right - boardRect.left - 2;
    const y1 = wordRect.top - boardRect.top + wordRect.height / 2;
    const x2 = sentenceRect.left - boardRect.left + 2;
    const y2 = sentenceRect.top - boardRect.top + sentenceRect.height / 2;
    const bend = Math.max(18, (x2 - x1) * 0.45);
    const sentence = state.matchSentences.find((item) => item.sid === sid);
    const color = state.matchChecked
      ? sentence && (sentence.accepts || [sentence.word]).includes(word) ? '#2E7C59' : '#B6534C'
      : palette[index % palette.length];
    markup += '<path d="M ' + x1 + ' ' + y1 + ' C ' + (x1 + bend) + ' ' + y1 +
      ', ' + (x2 - bend) + ' ' + y2 + ', ' + x2 + ' ' + y2 +
      '" fill="none" stroke="' + color + '" stroke-width="2.2" stroke-linecap="round" opacity=".62"></path>' +
      '<circle cx="' + x1 + '" cy="' + y1 + '" r="3" fill="' + color + '"></circle>' +
      '<circle cx="' + x2 + '" cy="' + y2 + '" r="3" fill="' + color + '"></circle>';
  });
  svg.innerHTML = markup;
}

function renderEvidenceBack(question) {
  const evidence = evidenceById[question.id];
  const classes = evidence
    ? evidence.classes.map((item) =>
        '<div class="evidence-class"><b>' + escapeHtml(item.label) + '</b>' +
          '<div class="evidence-examples">' +
            item.examples.map((example) =>
              '<span class="evidence-example">' +
                highlightInText(example, question.word) + '</span>'
            ).join('') +
          '</div>' +
          (item.note ? '<p>' + escapeHtml(item.note) + '</p>' : '') +
        '</div>'
      ).join('')
    : '';
  const forbidden = evidence
    ? evidence.forbidden.map((item) =>
        '<div class="forbidden-row"><span class="bad-form">× ' + escapeHtml(item.form) +
          '</span><br><span class="fix-form">→ ' + escapeHtml(item.fix) + '</span>' +
          '<span class="forbidden-logic">' + escapeHtml(item.why) + '</span></div>'
      ).join('')
    : '';
  const contrast = evidence
    ? evidence.contrast.map((item) =>
        '<div class="contrast-row"><b>' + escapeHtml(item.word) + '</b>：' +
          escapeHtml(item.difference) + '</div>'
      ).join('')
    : '';
  const sources = evidence
    ? evidence.sources.map((item) =>
        '<span class="source-badge' + (item.status === 'pending' ? ' pending' : '') + '">' +
          escapeHtml(item.type + ' · ' +
            (item.type === '真题' ? examSource(question) : item.label)) + '</span>'
      ).join('')
    : '';
  const corpusQueries = evidence?.corpusQueries?.length
    ? '<p class="section-label">语料库检索式</p>' +
      '<div class="corpus-queries">' +
        evidence.corpusQueries.map((query) =>
          '<span class="corpus-query">' + escapeHtml(query) + '</span>'
        ).join('') +
      '</div>' +
      '<a class="corpus-link" href="' + TWC_URL + '" target="_blank" rel="noopener">' +
        '打开筑波语料库核验 →</a>'
    : '';

  if (!evidence) {
    return '<div class="flash-core">' + escapeHtml(question.core || '') + '</div>' +
      '<p class="trap">' + escapeHtml(question.trap || '') + '</p>';
  }

  return '<div class="flash-back">' +
    '<div class="flash-head"><h2>' + escapeHtml(question.word) + '</h2>' +
      '<span class="evidence-status">' + escapeHtml(evidence.status) + '</span></div>' +
    '<p class="reading">' + escapeHtml(question.reading) + ' · ' +
      escapeHtml(examSource(question)) + '</p>' +
    '<p class="section-label">核心语义</p>' +
    '<div class="flash-core">' + escapeHtml(question.core) + '</div>' +
    '<p class="section-label">可接类别与典型搭配</p>' +
    '<div class="evidence-classes">' + classes + '</div>' +
    '<p class="section-label">禁用搭配与自然替代</p>' +
    '<div class="evidence-forbidden">' + forbidden + '</div>' +
    '<p class="section-label">近义词边界</p>' +
    '<div class="contrast-list">' + contrast + '</div>' +
    '<p class="trap"><b>中文陷阱：</b>' + escapeHtml(question.trap) + '</p>' +
    '<p class="section-label">证据来源</p>' +
    '<div class="source-badges">' + sources + '</div>' +
    corpusQueries +
  '</div>';
}

function renderCards() {
  rebuildCards();
  if (!state.cardDeck.length) {
    return '<section class="empty"><h2>还没有搭配卡</h2><p>先在 questions.json 中加入题目。</p></section>';
  }

  const question = state.cardDeck[state.cardIndex];
  const record = recordFor(question.id);
  const wordClass = question.word.length >= 6 ? ' long' : '';

  let body = '';
  if (!state.cardRevealed) {
    body = '<div class="flash-front">' +
      '<h2 class="word' + wordClass + '">' + escapeHtml(question.word) + '</h2>' +
      '<p class="reading">' + escapeHtml(question.reading) + '</p>' +
      '<p class="flash-tip">先想：核心义 + 两个自然搭配<br>想完再翻开</p>' +
    '</div>';
  } else {
    body = renderEvidenceBack(question);
  }

  return '<div class="deckbar"><p>' + (state.cardIndex + 1) + ' / ' +
      state.cardDeck.length + ' · 搭配证据卡</p>' +
      '<button class="star' + (record.starred ? ' on' : '') +
      '" data-action="star" aria-label="标记重点">★</button></div>' +
    '<div class="flash-wrap">' +
      '<section class="flash-card" data-action="card-flip">' +
        '<div class="flash-head"><span class="source">' +
          escapeHtml(examSource(question)) +
        '</span><span class="tag">' + escapeHtml(question.category) + '</span></div>' +
        body +
      '</section>' +
      '<div class="bottom-nav three">' +
        '<button class="nav-btn" data-action="card-prev"' +
          (state.cardIndex === 0 ? ' disabled' : '') + '>← 上一张</button>' +
        '<button class="nav-btn primary" data-action="card-flip">' +
          (state.cardRevealed ? '收起' : '翻面') + '</button>' +
        '<button class="nav-btn primary" data-action="card-next"' +
          (state.cardIndex >= state.cardDeck.length - 1 ? ' disabled' : '') + '>下一张 →</button>' +
      '</div>' +
    '</div>';
}

function renderStats() {
  let attempts = 0;
  let correct = 0;
  const categoryCounts = {};
  const wrongQuestions = [];

  for (const question of DATA.questions) {
    const record = store.records[question.id];
    if (!record) continue;
    attempts += record.attempts || 0;
    correct += record.correct || 0;
    if (record.wrong) {
      categoryCounts[question.category] = (categoryCounts[question.category] || 0) + record.wrong;
      wrongQuestions.push({ question, record });
    }
  }

  const accuracy = attempts ? Math.round((correct / attempts) * 100) : 0;
  const due = DATA.questions.filter(isDue).length;
  const matchResults = Object.values(store.matchResults || {});
  const matchAttempts = matchResults.reduce((sum, item) => sum + (item.attempts || 0), 0);
  const matchCorrect = matchResults.reduce((sum, item) => sum + (item.correct || 0), 0);
  const matchAccuracy = matchAttempts ? Math.round((matchCorrect / matchAttempts) * 100) : 0;
  const unresolvedMistakes = Object.entries(store.matchMistakes || {})
    .filter(([, item]) => item.unresolved);
  const matchMistakeList = unresolvedMistakes.length
    ? unresolvedMistakes.map(([id, item]) => {
        const match = (DATA.matches || []).find((entry) => entry.id === id);
        if (!match) return '';
        const errors = (item.errors || []).map((error) =>
          '<div class="match-mistake-row">' + escapeHtml(error.frame) + ' ← ' +
            '<b>' + escapeHtml(error.assigned || '未连接') + '</b>　正确：' +
            '<em>' + error.accepted.map(escapeHtml).join('／') + '</em></div>'
        ).join('');
        return '<div class="match-mistake-item">' +
          '<div class="match-mistake-head"><div><b>' + escapeHtml(match.focus) + '</b>' +
            '<span>' + escapeHtml(match.source) + ' · 错 ' +
            (item.wrongAttempts || 1) + ' 次 · ' +
            escapeHtml(MATCH_MODE_LABELS[match.mode] || '') + '</span></div>' +
            '<div class="match-mistake-actions">' +
              '<button data-match-jump="' + escapeHtml(id) + '">整题重连</button>' +
              '<button data-match-error="' + escapeHtml(id) + '">只练错配</button>' +
            '</div></div>' +
          '<div class="match-mistake-errors">' + errors + '</div>' +
        '</div>';
      }).join('')
    : '<p class="trap">还没有待订正的连线题。</p>';
  const maxCategory = Math.max(1, ...Object.values(categoryCounts));
  const categories = Object.entries(categoryCounts)
    .sort((a, b) => b[1] - a[1])
    .map(([name, count]) =>
      '<div class="category-row"><span>' + escapeHtml(name) + '</span>' +
      '<div class="bar"><i style="width:' + Math.round((count / maxCategory) * 100) + '%"></i></div>' +
      '<b>' + count + '</b></div>'
    ).join('');

  wrongQuestions.sort((a, b) => b.record.lastAt - a.record.lastAt);
  const wrongList = wrongQuestions.length
    ? wrongQuestions.map(({ question, record }) =>
        '<button class="wrong-item" data-jump="' + escapeHtml(question.id) + '">' +
          '<span><b>' + escapeHtml(question.word) + '</b>' +
          '<span>' + escapeHtml(question.year + ' 問' + question.no) +
          ' · ' + escapeHtml(question.category) + '</span></span>' +
          '<span class="wrong-count">错 ' + record.wrong + ' 次</span>' +
        '</button>'
      ).join('')
    : '<p class="trap">还没有错题。</p>';

  return '<div class="stats-grid">' +
      '<div class="stat"><span>总答题</span><b>' + attempts + '</b></div>' +
      '<div class="stat"><span>正确率</span><b>' + accuracy + '%</b></div>' +
      '<div class="stat"><span>待复习</span><b>' + due + '</b></div>' +
      '<div class="stat"><span>错题词</span><b>' + wrongQuestions.length + '</b></div>' +
      '<div class="stat"><span>连线完成</span><b>' + matchResults.length + '</b></div>' +
      '<div class="stat"><span>连线正确率</span><b>' + matchAccuracy + '%</b></div>' +
      '<div class="stat"><span>连线待改</span><b>' + unresolvedMistakes.length + '</b></div>' +
    '</div>' +
    '<section class="panel"><h2>主要错误类型</h2>' +
      (categories || '<p class="trap">做几题之后，这里会显示你最常错的辨析类型。</p>') +
    '</section>' +
    '<section class="panel"><h2>错题本</h2><div class="wrong-list">' + wrongList + '</div></section>' +
    '<section class="panel"><h2>连线错题</h2><div class="match-mistake-list">' +
      matchMistakeList + '</div></section>' +
    '<div class="actions-row">' +
      '<button class="mini-btn" data-filter="due">复习待到期</button>' +
      '<button class="mini-btn" data-filter="wrong">只练错题</button>' +
      '<button class="mini-btn danger" data-action="reset">清除学习记录</button>' +
    '</div>';
}

function choose(number) {
  if (state.answered || !state.deck.length) return;
  const question = state.deck[state.index];
  const record = recordFor(question.id);
  const isCorrect = number === question.answer;

  ensureToday();
  record.attempts += 1;
  record.lastAt = Date.now();
  record.lastChoice = number;
  store.today.attempts += 1;

  if (isCorrect) {
    record.correct += 1;
    record.streak += 1;
    store.today.correct += 1;
    const intervalIndex = Math.min(record.streak - 1, REVIEW_DAYS.length - 1);
    record.dueAt = Date.now() + REVIEW_DAYS[intervalIndex] * DAY;
  } else {
    record.wrong += 1;
    record.streak = 0;
    record.dueAt = Date.now() + DAY;
  }

  state.answered = true;
  state.selected = number;
  state.revealedAnswer = false;
  saveStore();
  render();

  requestAnimationFrame(() => {
    const feedback = document.querySelector('.feedback');
    if (feedback) feedback.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
}

function nextQuestion() {
  if (!state.deck.length) return;
  if (state.index < state.deck.length - 1) {
    state.index += 1;
    state.answered = false;
    state.selected = null;
    state.revealedAnswer = false;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function revealAnswer() {
  if (state.answered || !state.deck.length) return;
  const question = state.deck[state.index];
  if (!question) return;
  ensureToday();
  const record = recordFor(question.id);
  record.attempts += 1;
  record.wrong += 1;
  record.streak = 0;
  record.lastAt = Date.now();
  record.lastChoice = 0;
  record.dueAt = Date.now() + DAY;
  store.today.attempts += 1;
  state.answered = true;
  state.selected = null;
  state.revealedAnswer = true;
  saveStore();
  render();
  requestAnimationFrame(() => {
    document.querySelector('.feedback')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
}

function previousQuestion() {
  if (state.index <= 0) return;
  state.index -= 1;
  state.answered = false;
  state.selected = null;
  state.revealedAnswer = false;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleStar() {
  const question = state.view === 'cards'
    ? state.cardDeck[state.cardIndex]
    : state.deck[state.index];
  if (!question) return;
  const record = recordFor(question.id);
  record.starred = !record.starred;
  saveStore();

  if (state.view === 'practice') {
    const keep = state.deck[state.index]?.id;
    if (state.filter === 'starred') rebuildDeck('starred', record.starred ? keep : null);
  }
  render();
}

function switchView(view) {
  const activeId = state.activeQuestionId || currentViewQuestionId();
  state.view = view;
  if (view === 'match') state.indexMode = 'match';
  if (view === 'practice') state.indexMode = 'practice';
  if (view === 'match') {
    rebuildMatch(activeId || state.matchDeck[state.matchIndex]?.id);
  }
  if (view === 'practice') {
    if (activeId) {
      rebuildDeck(state.filter, activeId);
      if (!state.deck.some((question) => question.id === activeId)) {
        rebuildDeck('all', activeId);
      }
    } else {
      rebuildDeck('all', null);
    }
  }
  if (view === 'cards') {
    state.cardRevealed = false;
    focusEvidence(activeId);
  }
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleShuffle() {
  state.shuffle = !state.shuffle;
  const keep = state.deck[state.index]?.id;
  rebuildDeck(state.filter, keep);
  render();
}

document.addEventListener('click', (event) => {
  if (event.target.closest('#indexToggle')) {
    document.body.classList.add('index-open');
    requestAnimationFrame(() => document.querySelector('#indexSearch')?.focus());
    return;
  }
  if (event.target.closest('#indexClose') || event.target.closest('#indexBackdrop')) {
    closeIndexPanel();
    return;
  }

  const indexMode = event.target.closest('[data-index-mode]');
  if (indexMode) {
    state.indexMode = indexMode.dataset.indexMode;
    renderIndexPanel();
    return;
  }

  const indexNumber = event.target.closest('[data-index-id]');
  if (indexNumber) {
    const id = indexNumber.dataset.indexId;
    selectQuestionEverywhere(id, state.indexMode === 'match' ? 'match' : 'practice');
    closeIndexPanel();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  const segment = event.target.closest('[data-view]');
  if (segment) {
    switchView(segment.dataset.view);
    return;
  }

  const chip = event.target.closest('[data-filter]');
  if (chip) {
    state.view = 'practice';
    rebuildDeck(chip.dataset.filter, null);
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  const choice = event.target.closest('[data-choice]');
  if (choice && state.view === 'practice') {
    choose(Number(choice.dataset.choice));
    return;
  }

  const jump = event.target.closest('[data-jump]');
  if (jump) {
    state.view = 'practice';
    rebuildDeck('wrong', jump.dataset.jump);
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  const matchJump = event.target.closest('[data-match-jump]');
  if (matchJump) {
    const id = matchJump.dataset.matchJump;
    state.view = 'match';
    rebuildMatch(id);
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  const matchErrorJump = event.target.closest('[data-match-error]');
  if (matchErrorJump) {
    const id = matchErrorJump.dataset.matchError;
    const mistake = store.matchMistakes[id];
    if (!mistake) return;
    state.view = 'match';
    rebuildMatch(id);
    state.matchErrorSids = (mistake.errors || [])
      .map((error) => error.sid || state.matchSentences.find((sentence) =>
        sentence.frame === error.frame
      )?.sid)
      .filter(Boolean);
    if (!state.matchErrorSids.length) return;
    state.matchErrorMode = true;
    for (const sid of state.matchErrorSids) delete state.matchAssignments[sid];
    state.matchChecked = false;
    state.matchCorrect = false;
    state.matchSelected = null;
    persistMatchAssignments();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  const matchWord = event.target.closest('[data-match-word]');
  if (matchWord && state.view === 'match' && !state.matchChecked) {
    const word = matchWord.dataset.matchWord;
    state.matchSelected = state.matchSelected === word ? null : word;
    render();
    return;
  }

  const matchSentence = event.target.closest('[data-match-sentence]');
  if (matchSentence && state.view === 'match' && !state.matchChecked) {
    const sid = matchSentence.dataset.matchSentence;
    if (state.matchSelected) {
      const match = state.matchDeck[state.matchIndex];
      if (!match?.multi) {
        for (const [existingSid, word] of Object.entries(state.matchAssignments)) {
          if (word === state.matchSelected) delete state.matchAssignments[existingSid];
        }
      }
      state.matchAssignments[sid] = state.matchSelected;
      state.matchSelected = null;
    } else if (state.matchAssignments[sid]) {
      delete state.matchAssignments[sid];
    }
    persistMatchAssignments();
    render();
    return;
  }

  const action = event.target.closest('[data-action]');
  if (!action) return;
  const name = action.dataset.action;

  if (name === 'star') toggleStar();
  if (name === 'shuffle') toggleShuffle();
  if (name === 'prev') previousQuestion();
  if (name === 'next') nextQuestion();
  if (name === 'reveal-answer') revealAnswer();
  if (name === 'match-clear' && !state.matchChecked) {
    for (const sentence of currentMatchSentences()) {
      delete state.matchAssignments[sentence.sid];
    }
    state.matchSelected = null;
    persistMatchAssignments();
    render();
  }
  if (name === 'match-check' && !state.matchChecked) {
    const match = state.matchDeck[state.matchIndex];
    if (!match) return;
    const sentencesToCheck = currentMatchSentences();
    const complete = sentencesToCheck.every((sentence) =>
      Boolean(state.matchAssignments[sentence.sid])
    );
    if (!complete) return;
    state.matchCorrect = sentencesToCheck.every((sentence) =>
      (sentence.accepts || [sentence.word]).includes(state.matchAssignments[sentence.sid])
    );
    state.matchChecked = true;
    const wrongPairs = sentencesToCheck
      .filter((sentence) =>
        !(sentence.accepts || [sentence.word]).includes(state.matchAssignments[sentence.sid])
      )
      .map((sentence) => ({
        sid: sentence.sid,
        frame: sentence.frame,
        assigned: state.matchAssignments[sentence.sid],
        accepted: sentence.accepts || [sentence.word],
        example: sentence.text
      }));

    if (state.matchErrorMode) {
      const mistake = store.matchMistakes[match.id];
      if (state.matchCorrect) {
        if (mistake) {
          mistake.unresolved = false;
          mistake.resolvedAt = Date.now();
          mistake.errors = [];
        }
        state.matchErrorSids = [];
      } else {
        if (mistake) {
          mistake.unresolved = true;
          mistake.lastAt = Date.now();
          mistake.errors = wrongPairs;
          mistake.wrongAttempts = (mistake.wrongAttempts || 0) + 1;
        }
        state.matchErrorSids = wrongPairs.map((pair) => pair.sid);
      }
      persistMatchAssignments();
      saveStore();
      render();
      requestAnimationFrame(() => {
        document.querySelector('.match-feedback')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
      return;
    }

    const previous = store.matchResults[match.id];
    store.matchResults[match.id] = {
      attempts: (previous?.attempts || 0) + 1,
      correct: (previous?.correct || 0) + (state.matchCorrect ? 1 : 0),
      lastOk: state.matchCorrect,
      at: Date.now()
    };
    if (wrongPairs.length) {
      const oldMistake = store.matchMistakes[match.id];
      store.matchMistakes[match.id] = {
        unresolved: true,
        wrongAttempts: (oldMistake?.wrongAttempts || 0) + 1,
        lastAt: Date.now(),
        errors: wrongPairs
      };
    } else if (store.matchMistakes[match.id]) {
      store.matchMistakes[match.id].unresolved = false;
      store.matchMistakes[match.id].resolvedAt = Date.now();
    }
    state.matchErrorSids = wrongPairs.map((pair) => pair.sid);
    if (!previous) store.today.attempts += 1;
    persistMatchAssignments();
    render();
    requestAnimationFrame(() => {
      document.querySelector('.match-feedback')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  }
  if (name === 'match-redo') {
    const match = state.matchDeck[state.matchIndex];
    if (!match) return;
    for (const sentence of currentMatchSentences()) {
      delete state.matchAssignments[sentence.sid];
    }
    state.matchSelected = null;
    state.matchChecked = false;
    state.matchCorrect = false;
    persistMatchAssignments();
    render();
  }
  if (name === 'match-prev') {
    persistMatchAssignments();
    if (state.matchIndex > 0) state.matchIndex -= 1;
    prepareMatchQuestion();
    rememberMatchPosition();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  if (name === 'match-next') {
    persistMatchAssignments();
    if (state.matchIndex < state.matchDeck.length - 1) state.matchIndex += 1;
    prepareMatchQuestion();
    rememberMatchPosition();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  if (name === 'match-this-question') {
    const question = state.deck[state.index];
    if (!question) return;
    state.view = 'match';
    rebuildMatch(question.id);
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  if (name === 'practice-evidence') {
    const question = state.deck[state.index];
    if (question) openEvidence(question.id);
  }
  if (name === 'match-error-mode') {
    if (!state.matchErrorSids.length) return;
    for (const sid of state.matchErrorSids) delete state.matchAssignments[sid];
    state.matchErrorMode = true;
    state.matchChecked = false;
    state.matchCorrect = false;
    state.matchSelected = null;
    persistMatchAssignments();
    render();
    document.querySelector('#matchBoard')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  if (name === 'match-exit-error') {
    state.matchErrorMode = false;
    state.matchErrorSids = [];
    state.matchChecked = false;
    state.matchCorrect = false;
    state.matchSelected = null;
    prepareMatchQuestion();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  if (name === 'open-evidence') {
    const match = state.matchDeck[state.matchIndex];
    if (!match) return;
    openEvidence(match.id);
  }
  if (name === 'card-flip') {
    state.cardRevealed = !state.cardRevealed;
    render();
  }
  if (name === 'card-prev') {
    if (state.cardIndex > 0) state.cardIndex -= 1;
    state.cardRevealed = false;
    rememberEvidencePosition();
    render();
  }
  if (name === 'card-next') {
    if (state.cardIndex < state.cardDeck.length - 1) state.cardIndex += 1;
    state.cardRevealed = false;
    rememberEvidencePosition();
    render();
  }
  if (name === 'reset') {
    if (confirm('清除所有答题记录、错题和重点标记？')) {
      store = defaultStore();
      saveStore();
      state.view = 'match';
      rebuildDeck('all', null);
      rebuildMatch(null);
      render();
    }
  }
});

window.addEventListener('resize', () => {
  if (state.view === 'match') requestAnimationFrame(drawMatchLines);
});

let indexSearchComposing = false;

document.addEventListener('compositionstart', (event) => {
  if (event.target.id === 'indexSearch') indexSearchComposing = true;
});

document.addEventListener('compositionend', (event) => {
  if (event.target.id !== 'indexSearch') return;
  indexSearchComposing = false;
  state.indexQuery = event.target.value;
  renderIndexResults();
});

document.addEventListener('input', (event) => {
  if (event.target.id !== 'indexSearch') return;
  if (indexSearchComposing || event.isComposing) return;
  state.indexQuery = event.target.value;
  renderIndexResults();
});

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && document.body.classList.contains('index-open')) {
    closeIndexPanel();
    return;
  }
  const target = event.target;
  if (target instanceof HTMLElement &&
      (target.matches('input, textarea, select') || target.isContentEditable)) return;
  if (event.metaKey || event.ctrlKey || event.altKey) return;

  if (state.view === 'practice') {
    if (!state.answered && /^[1-4]$/.test(event.key)) {
      choose(Number(event.key));
      event.preventDefault();
      return;
    }
    if (event.key === 'ArrowLeft') {
      previousQuestion();
      event.preventDefault();
    }
    if (event.key === 'ArrowRight') {
      nextQuestion();
      event.preventDefault();
    }
  }

  if (state.view === 'cards') {
    if (event.key === ' ' || event.key === 'Enter') {
      state.cardRevealed = !state.cardRevealed;
      render();
      event.preventDefault();
    }
    if (event.key === 'ArrowLeft' && state.cardIndex > 0) {
      state.cardIndex -= 1;
      state.cardRevealed = false;
      render();
      event.preventDefault();
    }
    if (event.key === 'ArrowRight' && state.cardIndex < state.cardDeck.length - 1) {
      state.cardIndex += 1;
      state.cardRevealed = false;
      render();
      event.preventDefault();
    }
  }
});

$('#subtitle').textContent = DATA.meta.subtitle;
document.title = DATA.meta.title + ' · 語彙の使い方';
rebuildMatch(store.lastMatchId || null);
const initialId = state.matchDeck[state.matchIndex]?.id ||
  store.lastEvidenceId ||
  DATA.questions[0]?.id ||
  null;
state.activeQuestionId = initialId || '';
rebuildDeck('all', initialId);
focusEvidence(initialId);
render();
scheduleCountdownRefresh();
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) updateCountdown();
});
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
