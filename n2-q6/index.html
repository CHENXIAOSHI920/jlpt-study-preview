<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="問題六">
<meta name="theme-color" content="#F4F0E7">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>問題六 · 語彙の使い方</title>
<style>
  :root{
    --ink:#252B29;
    --ink2:#5F6863;
    --ink3:#929A94;
    --paper:#F4F0E7;
    --card:#FFFDF8;
    --line:#E5DED1;
    --accent:#28776B;
    --accent-soft:#E9F3EF;
    --good:#2E7C59;
    --good-soft:#EAF5ED;
    --bad:#B6534C;
    --bad-soft:#FBECEA;
    --gold:#B98520;
    --gold-soft:#FFF6DF;
    --shadow:0 18px 44px -28px rgba(49,55,51,.42);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--paper)}
  body{
    margin:0 auto;
    min-height:100dvh;
    max-width:1180px;
    padding:18px 16px calc(22px + env(safe-area-inset-bottom));
    color:var(--ink);
    background:
      radial-gradient(circle at 100% 0%,rgba(40,119,107,.07),transparent 30%),
      var(--paper);
    font-family:"PingFang SC","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit}
  .app-shell{
    display:grid;
    grid-template-columns:minmax(0,720px) 292px;
    gap:24px;
    align-items:start;
    justify-content:center;
  }
  .app-main{min-width:0}
  .index-panel{
    position:sticky;
    top:18px;
    max-height:calc(100vh - 36px);
    overflow:auto;
    border:1px solid var(--line);
    border-radius:20px;
    background:var(--card);
    box-shadow:var(--shadow);
    padding:15px;
    scrollbar-width:thin;
  }
  .index-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:11px;
  }
  .index-head h2{
    margin:0;
    font-size:14px;
    letter-spacing:.02em;
  }
  .index-close{
    display:none;
    width:30px;
    height:30px;
    border:1px solid var(--line);
    border-radius:50%;
    background:#fff;
    color:var(--ink2);
    cursor:pointer;
  }
  .index-tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:3px;
    padding:3px;
    margin-bottom:9px;
    border:1px solid var(--line);
    border-radius:11px;
    background:#F7F3EB;
  }
  .index-tab{
    border:0;
    border-radius:8px;
    padding:6px 4px;
    background:transparent;
    color:var(--ink3);
    cursor:pointer;
    font-size:11px;
  }
  .index-tab.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px -5px rgba(0,0,0,.35)}
  .index-search{
    width:100%;
    border:1px solid var(--line);
    border-radius:9px;
    padding:8px 9px;
    margin-bottom:12px;
    outline:none;
    background:#fff;
    color:var(--ink);
    font:inherit;
    font-size:11px;
  }
  .index-search:focus{border-color:#A9C9C1}
  .index-group + .index-group{margin-top:13px;padding-top:12px;border-top:1px solid #F0ECE4}
  .index-session{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:7px;
  }
  .index-session b{
    font-size:12px;
    font-variant-numeric:tabular-nums;
  }
  .index-session span{font-size:9px;color:var(--ink3)}
  .index-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
  .index-num{
    position:relative;
    aspect-ratio:1;
    min-width:0;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink2);
    cursor:pointer;
    font-size:10.5px;
    font-variant-numeric:tabular-nums;
  }
  .index-num:hover{border-color:#9DC3B9}
  .index-num.active{
    border-color:var(--accent);
    background:var(--accent);
    color:#fff;
    font-weight:700;
  }
  .index-num.done:not(.active){background:var(--good-soft);border-color:#B8D8C3;color:#2C674D}
  .index-num.wrong:not(.active){background:var(--bad-soft);border-color:#E0B0AA;color:var(--bad)}
  .index-num.starred::after{
    content:"★";
    position:absolute;
    top:-4px;
    right:-3px;
    color:var(--gold);
    font-size:9px;
  }
  .index-empty{padding:20px 8px;text-align:center;color:var(--ink3);font-size:10.5px}
  .index-toggle{
    display:none;
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 11px;
    background:rgba(255,253,248,.82);
    color:var(--ink2);
    cursor:pointer;
    font-size:11px;
  }
  .index-backdrop{
    display:none;
    position:fixed;
    inset:0;
    z-index:35;
    background:rgba(25,32,29,.3);
    backdrop-filter:blur(2px);
  }
  @media (max-width:980px){
    body{max-width:720px}
    .app-shell{display:block}
    .index-toggle{display:block;grid-column:1/-1;justify-self:end}
    .top .tool-nav{
      flex-direction:column;
      align-items:flex-end;
      gap:6px;
    }
    .index-panel{
      position:fixed;
      z-index:36;
      top:0;
      right:0;
      width:min(88vw,340px);
      height:100dvh;
      max-height:none;
      border-radius:20px 0 0 20px;
      transform:translateX(105%);
      visibility:hidden;
      pointer-events:none;
      transition:none;
      padding:18px 16px calc(20px + env(safe-area-inset-bottom));
    }
    body.index-open .index-panel{
      transform:translateX(0);
      visibility:visible;
      pointer-events:auto;
      transition:transform .25s ease;
    }
    body.index-open .index-backdrop{display:block}
    .index-close{display:block}
  }
  .top{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto 272px;
    gap:12px;
    align-items:start;
    margin-bottom:16px;
  }
  .eyebrow{
    margin:0 0 4px;
    color:var(--accent);
    font-size:11px;
    font-weight:700;
    letter-spacing:.15em;
  }
  h1{
    margin:0;
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
    font-size:30px;
    line-height:1.1;
    letter-spacing:.06em;
    font-weight:600;
  }
  .subtitle{
    margin:7px 0 0;
    color:var(--ink3);
    font-size:12px;
    line-height:1.5;
  }
  .tool-nav{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    min-width:0;
  }
  .preview-return{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    min-height:48px;
    padding:0 18px;
    border:1px solid color-mix(in srgb,var(--accent) 82%,#000);
    border-radius:999px;
    background:var(--accent);
    color:#fff;
    box-shadow:
      0 2px 0 rgba(255,255,255,.2) inset,
      0 14px 32px -14px color-mix(in srgb,var(--accent) 78%,transparent);
    font-size:13px;
    font-weight:850;
    line-height:1.2;
    letter-spacing:.02em;
    text-decoration:none;
    white-space:nowrap;
    touch-action:manipulation;
    transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
  }
  .preview-return svg{
    width:17px;
    height:17px;
    flex:0 0 auto;
  }
  .preview-return:hover{
    color:#fff;
    filter:brightness(1.04);
    box-shadow:
      0 2px 0 rgba(255,255,255,.2) inset,
      0 18px 36px -14px color-mix(in srgb,var(--accent) 88%,transparent);
    transform:translateY(-2px);
  }
  .preview-return:active{
    filter:brightness(.96);
    transform:translateY(1px) scale(.99);
  }
  .preview-return:focus-visible{
    outline:3px solid color-mix(in srgb,var(--accent) 36%,transparent);
    outline-offset:3px;
  }
  .purchase-note{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:42px;
    margin:0;
    padding:8px 12px;
    border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);
    border-radius:12px;
    background:color-mix(in srgb,var(--accent) 9%,#fffdf8);
    box-shadow:0 8px 20px -18px color-mix(in srgb,var(--accent) 60%,transparent);
    color:color-mix(in srgb,var(--accent) 84%,#182320);
    font-size:11.5px;
    font-weight:800;
    line-height:1.4;
    white-space:nowrap;
  }
  .today{
    min-width:64px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:15px;
    background:rgba(255,253,248,.72);
    text-align:center;
  }
  .today b{
    display:block;
    font-size:21px;
    font-weight:650;
    font-variant-numeric:tabular-nums;
  }
  .today span{font-size:10px;color:var(--ink3)}
  .creator-bear-card{
    width:272px;
    max-width:100%;
    min-width:0;
    padding:8px 9px 9px;
    border:1px solid var(--line);
    border-radius:15px;
    background:rgba(255,253,248,.82);
    text-align:left;
  }
  .creator-bear-card__countdown{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:9px;
    min-width:0;
    padding:0 1px 6px;
    border-bottom:1px solid var(--line);
  }
  .creator-bear-card__countdown b{
    flex:0 0 auto;
    font-size:25px;
    line-height:1;
    font-weight:650;
    font-variant-numeric:tabular-nums;
  }
  .creator-bear-card__meta{
    order:-1;
    min-width:0;
    color:var(--ink3);
    font-size:9px;
    line-height:1.35;
    white-space:nowrap;
  }
  .creator-bear-card__date{
    margin-left:3px;
    color:var(--ink2);
    font-variant-numeric:tabular-nums;
  }
  .creator-bear-card__info{
    min-width:0;
    display:grid;
    gap:1px;
    color:var(--ink3);
    font-size:8.5px;
    line-height:1.45;
  }
  .creator-bear-card__identity{
    display:grid;
    grid-template-columns:58px minmax(0,1fr);
    gap:9px;
    align-items:center;
    padding-top:7px;
  }
  .creator-bear-card__photo{
    width:58px;
    height:58px;
    display:block;
    object-fit:cover;
    object-position:center 53%;
    border:1px solid #E8E0D3;
    border-radius:9px;
    background:#fff;
    box-shadow:0 4px 10px -8px rgba(49,55,51,.55);
  }
  .creator-bear-card__line{
    display:block;
    min-width:0;
    white-space:nowrap;
  }
  .creator-bear-card__line--email{
    color:var(--ink2);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:8px;
    letter-spacing:-.035em;
    text-decoration:none;
  }
  .creator-bear-card__line--email:hover{
    color:var(--accent);
    text-decoration:underline;
  }
  .creator-bear-card__line--link{
    color:inherit;
    text-decoration:none;
  }
  .creator-bear-card__line--link:hover{
    color:var(--accent);
    text-decoration:underline;
  }
  @media (max-width:640px){
    .top .tool-nav{
      grid-column:1/-1;
      justify-self:center;
      flex-flow:row wrap;
      justify-content:center;
      align-items:center;
      width:100%;
    }
    .preview-return{
      min-height:48px;
      padding:0 16px;
    }
    .purchase-note{
      min-height:40px;
      padding:7px 10px;
      font-size:11px;
    }
    .creator-bear-card{
      grid-column:1/-1;
      width:272px;
      min-width:0;
      justify-self:center;
    }
  }
  .segments{
    grid-column:1/-1;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:4px;
    padding:4px;
    border:1px solid var(--line);
    border-radius:16px;
    background:rgba(255,253,248,.82);
  }
  .segment{
    border:0;
    border-radius:12px;
    padding:9px 5px;
    background:transparent;
    color:var(--ink2);
    cursor:pointer;
    font-size:13px;
    font-weight:600;
  }
  .segment.on{
    background:var(--ink);
    color:#fff;
    box-shadow:0 7px 18px -12px rgba(25,34,30,.7);
  }
  .match-card{
    position:relative;
    padding:19px 16px 17px;
    border:1px solid var(--line);
    border-radius:25px;
    background:var(--card);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .match-card::before{
    content:"";
    position:absolute;
    inset:0 0 auto;
    height:4px;
    background:linear-gradient(90deg,var(--accent),#D4A854);
  }
  .match-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    padding-bottom:13px;
  }
  .match-focus{
    margin:0 0 4px;
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
    font-size:25px;
    font-weight:600;
    letter-spacing:.04em;
  }
  .match-tip{
    margin:0 0 13px;
    padding:10px 12px;
    border-radius:11px;
    background:#F8F4EA;
    color:var(--ink2);
    font-size:11px;
    line-height:1.7;
  }
  .mode-note{
    display:block;
    margin-top:4px;
    color:var(--ink3);
    font-size:10px;
  }
  .match-board{
    position:relative;
    display:grid;
    grid-template-columns:minmax(86px,.72fr) minmax(0,1.8fr);
    gap:34px;
    padding:3px 0;
  }
  .match-lines{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    overflow:visible;
    pointer-events:none;
  }
  .match-column{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .match-word{
    position:relative;
    min-height:54px;
    width:100%;
    border:1px solid var(--line);
    border-radius:13px;
    padding:8px 9px;
    background:#fff;
    color:var(--ink);
    cursor:pointer;
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
    font-size:13.5px;
    line-height:1.45;
    text-align:center;
    transition:border-color .14s ease,background .14s ease,transform .14s ease;
  }
  .match-word.selected{
    border-color:var(--accent);
    background:var(--accent-soft);
    box-shadow:0 0 0 3px rgba(40,119,107,.08);
  }
  .match-word.assigned{
    border-color:var(--match-color,#8AB7AD);
    background:#F7FBF9;
  }
  .match-word.checked.ok{
    border-color:#A9D2B8;
    background:var(--good-soft);
  }
  .match-word.checked.no{
    border-color:#E4B0AB;
    background:var(--bad-soft);
  }
  .match-word:active:not(:disabled){transform:translateY(1px)}
  .match-sentence{
    position:relative;
    min-height:74px;
    width:100%;
    border:1px solid var(--line);
    border-radius:13px;
    padding:9px 11px;
    background:#fff;
    color:var(--ink);
    cursor:pointer;
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
    font-size:12.5px;
    line-height:1.7;
    text-align:left;
    transition:border-color .14s ease,background .14s ease;
  }
  .match-frame{
    display:block;
    color:var(--ink);
    font-size:13.5px;
    line-height:1.55;
  }
  .match-core{
    display:block;
    margin-top:3px;
    color:var(--ink3);
    font-family:"PingFang SC","Hiragino Sans",sans-serif;
    font-size:9.5px;
    line-height:1.35;
  }
  .match-sentence.assigned{
    border-color:var(--match-color,#8AB7AD);
    background:#F7FBF9;
  }
  .match-sentence.checked.ok{
    border-color:#A9D2B8;
    background:var(--good-soft);
  }
  .match-sentence.checked.no{
    border-color:#E4B0AB;
    background:var(--bad-soft);
  }
  .match-sentence:disabled,.match-word:disabled{cursor:default}
  .match-dot{
    position:absolute;
    top:50%;
    width:7px;
    height:7px;
    margin-top:-3.5px;
    border-radius:50%;
    background:var(--match-color,#B8B0A4);
    opacity:0;
  }
  .match-word .match-dot{right:-4px}
  .match-sentence .match-dot{left:-4px}
  .match-word.assigned .match-dot,.match-sentence.assigned .match-dot{opacity:1}
  .match-actions{
    display:grid;
    grid-template-columns:.72fr 1.28fr;
    gap:8px;
    margin-top:13px;
  }
  .match-progress{
    margin:12px 0 0;
    color:var(--ink3);
    text-align:center;
    font-size:10.5px;
  }
  .match-feedback{
    margin-top:15px;
    padding-top:15px;
    border-top:1px solid var(--line);
  }
  .study-section{
    margin-top:15px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .study-title{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    margin:0 0 9px;
    font-size:13px;
  }
  .study-title small{
    color:var(--ink3);
    font-size:9.5px;
    font-weight:400;
  }
  .original-options{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .original-option{
    display:grid;
    grid-template-columns:22px 1fr;
    gap:8px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#FBFAF6;
    color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
    font-size:12px;
    line-height:1.7;
  }
  .original-option.correct{
    border-color:#A9D2B8;
    background:var(--good-soft);
  }
  .original-option .num{
    width:20px;
    height:20px;
    font-size:9px;
  }
  .meaning-list{
    display:flex;
    flex-direction:column;
    gap:7px;
  }
  .meaning-row{
    padding:9px 10px;
    border-radius:10px;
    background:#F8F4EA;
    color:var(--ink2);
    font-size:10.5px;
    line-height:1.65;
  }
  .meaning-row b{
    color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
    font-size:13px;
  }
  .meaning-row p{
    margin:3px 0 0;
    color:var(--ink);
    font-size:11px;
  }
  .meaning-row span{
    display:block;
    margin-top:3px;
    color:var(--ink3);
  }
  .strategy-list{
    margin:0;
    padding-left:20px;
    color:var(--ink2);
    font-size:11.5px;
    line-height:1.8;
  }
  .strategy-list li{padding-left:2px;margin-bottom:5px}
  .strategy-list b{
    color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
    font-size:12.5px;
    font-weight:600;
  }
  .match-answers{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin-top:11px;
  }
  .match-answer-row{
    padding:11px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fff;
    color:var(--ink2);
    font-size:11.5px;
    line-height:1.7;
  }
  .match-pair{
    display:flex;
    align-items:center;
    gap:7px;
    color:var(--ink3);
  }
  .match-pair b{
    color:var(--accent);
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
    font-size:14px;
  }
  .match-pair strong{
    color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
    font-size:14px;
  }
  .match-example{
    margin-top:8px;
    padding:10px 11px;
    border-left:3px solid var(--accent);
    border-radius:0 9px 9px 0;
    background:var(--accent-soft);
  }
  .example-meta{
    color:var(--accent);
    font-size:9.5px;
    font-weight:700;
    letter-spacing:.04em;
  }
  .example-jp{
    margin:5px 0 0;
    color:#234D45;
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
    font-size:14.5px;
    line-height:1.8;
  }
  .example-zh{
    margin:3px 0 0;
    color:var(--ink2);
    font-size:11px;
    line-height:1.65;
  }
  .example-hit{
    color:var(--accent);
    font-style:normal;
    font-weight:700;
    text-decoration:underline;
    text-decoration-thickness:2px;
    text-underline-offset:3px;
  }

    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
    font-size:13px;
    line-height:1.4;
    transition:transform .12s ease,border-color .12s ease,opacity .12s ease;
  }
  .tile:active{transform:translateY(1px)}
  .tile:not(:disabled):hover{border-color:#A9C9C1}
  .tile.used{opacity:.18;pointer-events:none}
  .build-actions{
    display:grid;
    grid-template-columns:.8fr 1.2fr;
    gap:8px;
    margin-top:13px;
  }
  .build-btn{
    min-height:43px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fff;
    color:var(--ink2);
    cursor:pointer;
    font-size:12px;
  }
  .build-btn.primary{
    border-color:var(--ink);
    background:var(--ink);
    color:#fff;
    font-weight:650;
  }
  .build-btn:disabled{opacity:.35;cursor:default}
  .result-banner{
    margin-top:14px;
    padding:11px 13px;
    border-radius:12px;
    font-size:12.5px;
    font-weight:650;
  }
  .result-banner.good{background:var(--good-soft);color:#2C674D}
  .result-banner.bad{background:var(--bad-soft);color:#93463F}
  .model{
    margin-top:17px;
    padding-top:17px;
    border-top:1px solid var(--line);
  }
  .model-answer{
    margin:0 0 12px;
    padding:14px 15px;
    border-radius:14px;
    background:var(--good-soft);
    color:#275B45;
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
    font-size:15px;
    line-height:1.9;
  }
  .checklist{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin:0 0 13px;
    padding:0;
    list-style:none;
  }
  .checklist li{
    position:relative;
    padding-left:20px;
    color:var(--ink2);
    font-size:11.5px;
    line-height:1.7;
  }
  .checklist li::before{
    content:"□";
    position:absolute;
    left:0;
    top:-1px;
    color:var(--accent);
    font-size:14px;
  }
  .rating-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:14px;
  }
  .rating-btn{
    border:1px solid var(--line);
    border-radius:12px;
    padding:11px 9px;
    background:#fff;
    color:var(--ink2);
    cursor:pointer;
    font-size:12px;
  }
  .rating-btn.good{
    border-color:#A9D2B8;
    background:var(--good-soft);
    color:#2C674D;
  }
  .rating-note{
    margin:10px 0 0;
    color:var(--ink3);
    text-align:center;
    font-size:10.5px;
  }
  .stats-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
  }
  .stat{
    padding:15px;
    border:1px solid var(--line);
    border-radius:17px;
    background:var(--card);
  }
  .stat span{
    display:block;
    color:var(--ink3);
    font-size:10.5px;
  }
  .stat b{
    display:block;
    margin-top:3px;
    font-size:25px;
    font-weight:650;
    font-variant-numeric:tabular-nums;
  }
  .panel{
    padding:17px;
    border:1px solid var(--line);
    border-radius:20px;
    background:var(--card);
  }
  .panel h2{margin:0 0 13px;font-size:14px}
  .category-row{
    display:grid;
    grid-template-columns:72px 1fr 22px;
    gap:9px;
    align-items:center;
    margin:9px 0;
    font-size:11px;
    color:var(--ink2);
  }
  .bar{
    height:6px;
    border-radius:999px;
    background:#EDE8DE;
    overflow:hidden;
  }
  .bar i{
    display:block;
    height:100%;
    border-radius:inherit;
    background:linear-gradient(90deg,#D08A7D,#B6534C);
  }
  .wrong-list{display:flex;flex-direction:column;gap:7px}
  .wrong-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    width:100%;
    padding:10px 0;
    border:0;
    border-top:1px solid #F0ECE4;
    background:transparent;
    color:var(--ink);
    text-align:left;
    cursor:pointer;
  }
  .wrong-item:first-child{border-top:0}
  .wrong-item b{font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;font-size:15px}
  .wrong-item span{display:block;margin-top:2px;color:var(--ink3);font-size:10px}
  .wrong-count{color:var(--bad);font-size:11px;white-space:nowrap}
  .match-mistake-list{display:flex;flex-direction:column;gap:8px}
  .match-mistake-item{
    padding:11px 12px;
    border:1px solid #E7D6D2;
    border-radius:12px;
    background:#FFF9F7;
  }
  .match-mistake-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .match-mistake-head b{
    display:block;
    color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
    font-size:14px;
  }
  .match-mistake-head span{
    display:block;
    margin-top:2px;
    color:var(--ink3);
    font-size:9.5px;
  }
  .match-mistake-head button{
    border:1px solid #D7B5AF;
    border-radius:8px;
    padding:5px 8px;
    background:#fff;
    color:var(--bad);
    cursor:pointer;
    font-size:10px;
  }
  .match-mistake-actions{
    display:flex;
    flex:0 0 auto;
    gap:4px;
  }
  .match-mistake-errors{
    display:flex;
    flex-direction:column;
    gap:5px;
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed #E8C9C4;
  }
  .match-mistake-row{
    color:var(--ink2);
    font-size:10.5px;
    line-height:1.6;
  }
  .match-mistake-row b{color:var(--bad);font-weight:650}
  .match-mistake-row em{
    color:var(--good);
    font-style:normal;
    font-weight:650;
  }
  .actions-row{display:flex;gap:8px;flex-wrap:wrap}
  .mini-btn{
    border:1px solid var(--line);
    border-radius:11px;
    padding:9px 12px;
    background:#fff;
    color:var(--ink2);
    cursor:pointer;
    font-size:12px;
  }
  .mini-btn.danger{border-color:#E5B8B3;color:var(--bad)}
  .foot{
    margin:0 4px;
    color:var(--ink3);
    text-align:center;
    font-size:10.5px;
    line-height:1.65;
  }
  @media (max-width:430px){
    body{padding-left:12px;padding-right:12px}
    .eyebrow{font-size:9.5px;letter-spacing:.08em;white-space:nowrap}
    .question-card{padding:17px 14px}
    .option{padding:11px 10px;grid-template-columns:25px 1fr;gap:8px}
    .option-text{font-size:13.5px;line-height:1.75}
    .flash-card{min-height:400px;padding:18px}
  }
  @media (prefers-reduced-motion:reduce){
    *{scroll-behavior:auto!important;transition:none!important}
  }
</style>
</head>
